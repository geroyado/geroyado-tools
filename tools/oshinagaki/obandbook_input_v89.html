<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>お品書き入力 — 下呂観光ホテル</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Yu Gothic", "游ゴシック", sans-serif;
    background: #f5f2ee; color: #222; font-size: 14px;
  }

  /* ヘッダー */
  .header {
    background: #3a2e24; color: #e8ddd0;
    padding: 12px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  .header h1 { font-size: 16px; font-weight: bold; letter-spacing: 0.05em; }
  .header .date { font-size: 13px; color: #b0a090; margin-left: auto; }
  .header .version { font-size: 11px; color: #7a6a58; margin-left: 8px; }
  .status-badge {
    padding: 3px 12px; border-radius: 3px; font-size: 12px; font-weight: bold;
  }
  .badge-draft     { background: #7a5c00; color: #fff; }
  .badge-confirmed { background: #2d6a2d; color: #fff; }

  /* メインレイアウト */
  .container { max-width: 900px; margin: 0 auto; padding: 20px 16px; }

  /* アクションバー */
  .action-bar {
    background: #fff; border-radius: 8px; padding: 12px 16px;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  .btn {
    padding: 8px 18px; border-radius: 5px; border: none;
    cursor: pointer; font-size: 13px; font-weight: bold;
    transition: background 0.15s;
  }
  .btn-copy   { background: #5c7a5c; color: #fff; }
  .btn-copy:hover { background: #3e5c3e; }
  .btn-save   { background: #8b7355; color: #fff; }
  .btn-save:hover { background: #6e5a3e; }
  .btn-recover { background: #6b5a3a; color: #fff; }
  .btn-recover:hover { background: #4e4128; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-history { background: #4a5568; color: #fff; text-decoration: none; display: inline-flex; align-items: center; }
  .btn-history:hover { background: #2d3748; }
  .btn-confirm { background: #2d6a2d; color: #fff; font-size: 14px; padding: 10px 24px; margin-left: auto; }
  .btn-confirm:hover { background: #1e4a1e; }
  .btn-confirm:disabled { background: #999; cursor: not-allowed; }
  .btn-reopen { background: #7a5c00; color: #fff; font-size: 14px; padding: 10px 24px; margin-left: auto; }
  .badge-printed { background: #3a5a8a; color: #fff; margin-left: 8px; font-size: 12px; padding: 3px 10px; border-radius: 3px; }
  .btn-reopen:hover { background: #5a4200; }


  /* グループタブ（通常／連泊） */
  .group-tabs {
    display: flex; gap: 4px; margin-bottom: 0;
  }
  .group-tab {
    padding: 8px 28px; border-radius: 6px 6px 0 0;
    background: #7a6a58; color: #e8ddd0; cursor: pointer;
    font-size: 14px; font-weight: bold; border: none;
    transition: background 0.15s; letter-spacing: 0.05em;
  }
  .group-tab.active { background: #2c1e14; color: #f0e6d8; }
  .group-tab:hover:not(.active) { background: #5c4e3e; }

  /* コースタブ：グループタブに続く */
  .tabs {
    display: flex; gap: 4px; margin-bottom: 16px;
    border-top: 3px solid #2c1e14; padding-top: 4px;
  }
  /* コースタブ */
  .tabs {
    display: flex; gap: 4px; margin-bottom: 16px;
  }
  .tab {
    padding: 8px 20px; border-radius: 6px 6px 0 0;
    background: #d4c9b8; color: #555; cursor: pointer;
    font-size: 13px; font-weight: bold; border: none;
    transition: background 0.15s;
  }
  .tab.active { background: #3a2e24; color: #e8ddd0; }
  .tab:hover:not(.active) { background: #c0b09e; }

  /* 料理区分カード */
  .genre-card {
    background: #fff; border-radius: 0 8px 8px 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    margin-bottom: 12px; overflow: hidden;
  }
  .genre-header {
    background: #3a2e24; color: #e8ddd0;
    padding: 8px 16px;
    display: flex; align-items: center; gap: 12px;
    font-weight: bold; font-size: 14px;
  }
  .genre-header .genre-name { letter-spacing: 0.1em; }
  .genre-header .copy-btns  { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .btn-delete-genre {
    background: #7a2020; color: #fff; border: none;
    border-radius: 4px; padding: 4px 10px; font-size: 11px;
    cursor: pointer; white-space: nowrap; margin-left: 8px;
  }
  .btn-delete-genre:hover { background: #a33; }
  .btn-copy-small {
    padding: 3px 10px; border-radius: 3px; border: none;
    background: #5c5040; color: #e8ddd0; font-size: 11px;
    cursor: pointer;
  }
  .btn-copy-small:hover { background: #3e3428; }

  .genre-body { padding: 12px 16px; }

  /* 通常の入力フィールド */
  .field-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .field-label {
    width: 60px; font-size: 12px; color: #888; flex-shrink: 0;
  }
  .field-input {
    flex: 1; padding: 6px 10px; border: 1px solid #ccc;
    border-radius: 4px; font-size: 14px; font-family: inherit;
    background: #fafafa;
  }
  .field-input:disabled {
    background: #f0ede8; color: #888; cursor: not-allowed;
  }
  .field-input:focus {
    outline: none; border-color: #8b7355;
    background: #fff; box-shadow: 0 0 0 2px rgba(139,115,85,0.15);
  }

  /* 楽盛りアイテムリスト */
  .raku-list { display: flex; flex-direction: column; gap: 6px; }
  .raku-item-row {
    display: flex; align-items: center; gap: 8px;
  }
  .raku-num {
    width: 24px; height: 24px; background: #e8e0d4;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #666; flex-shrink: 0;
  }
  .raku-input {
    flex: 1; padding: 6px 10px; border: 1px solid #ccc;
    border-radius: 4px; font-size: 14px; font-family: inherit;
    background: #fafafa;
  }
  .raku-input:focus {
    outline: none; border-color: #8b7355; background: #fff;
    box-shadow: 0 0 0 2px rgba(139,115,85,0.15);
  }

  /* 飛騨牛ブロック */
  .genre-card.hida .genre-header { background: #6b3a1a; }

  /* トースト通知 */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 24px;
    border-radius: 6px; font-size: 13px; opacity: 0;
    transition: opacity 0.3s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; }

  /* 確認ダイアログ */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .overlay.show { display: flex; }
  .dialog {
    background: #fff; border-radius: 10px; padding: 28px 32px;
    max-width: 360px; width: 90%; text-align: center;
  }
  .dialog h3 { font-size: 16px; margin-bottom: 12px; }
  .dialog p  { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.6; }
  .dialog-btns { display: flex; gap: 12px; justify-content: center; }
  .btn-cancel  { padding: 8px 24px; border-radius: 5px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  .btn-ok      { padding: 8px 24px; border-radius: 5px; border: none; background: #2d6a2d; color: #fff; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div class="header">
  <h1>📋 お品書き入力</h1>
  <span class="version">v89</span>
  <span id="headerDate"></span>
  <span id="statusBadge" class="status-badge badge-draft">未確定</span>
</div>

<div class="container">

  <!-- アクションバー -->
  <div class="action-bar">
    <button class="btn btn-copy" onclick="confirmCopyAll()" disabled>📋 全項目を下位コースにコピー</button>
    <button class="btn btn-recover" id="btnRecover" onclick="recoverPreviousData()" disabled>📅 前日のデータを復旧</button>
    <button class="btn btn-save" onclick="saveData()" disabled>💾 一時保存</button>
    <a class="btn btn-history" href="obandbook_print_v88.html" target="_blank">📅 過去の献立</a>
    <button class="btn btn-confirm" id="btnConfirm" onclick="confirmAll()" disabled>✅ 全ての献立を確定する</button>
    <button class="btn btn-reopen" id="btnReopen" onclick="reopenAll()" style="display:none;" disabled>✏️ 確定を解除して編集する</button>
    <span class="badge-printed" id="badgePrinted" style="display:none;"></span>
  </div>
  <div id="loadingNotice" style="font-size:12px; color:#a08050; margin:-8px 0 12px 4px;">🔄 データを読み込み中です。しばらくお待ちください…</div>

  <!-- グループタブ（通常／連泊） -->
  <div class="group-tabs">
    <button class="group-tab active" id="grp-normal" onclick="switchGroup('normal', this)">通常</button>
    <button class="group-tab" id="grp-renp" onclick="switchGroup('renp', this)">連泊（2日目）</button>
  </div>

  <!-- コースタブ -->
  <div class="tabs" id="courseTabs">
    <button class="tab active" id="tab-yuki" onclick="switchTab('yuki', this)">雪コース</button>
    <button class="tab" id="tab-tsuki" onclick="switchTab('tsuki', this)">月コース</button>
    <button class="tab" id="tab-hana" onclick="switchTab('hana', this)">花コース</button>
    <button class="tab" id="tab-hida" onclick="switchTab('hida', this)">飛騨牛コース</button>
  </div>

  <!-- 入力フォーム -->
  <div id="formArea"></div>

  <!-- フッター：トラブル対応用ツールへの導線（普段は使わないため小さく表示） -->
  <div style="text-align:right; margin-top:24px; padding-top:8px; border-top:1px solid #e0d8cc;">
    <a href="obandbook_history.html" target="_blank" style="font-size:11px; color:#aaa; text-decoration:none;">🕒 保存ログを確認（トラブル調査用）</a>
  </div>

</div>

<!-- トースト -->
<div class="toast" id="toast"></div>

<!-- 確認ダイアログ -->
<div class="overlay" id="overlay">
  <div class="dialog">
    <h3 id="dialogTitle"></h3>
    <p id="dialogMsg"></p>
    <div class="dialog-btns">
      <button class="btn-cancel" id="dialogCancel">キャンセル</button>
      <button class="btn-ok" id="dialogOk">はい</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, get, remove, onValue, push, ServerValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyBk4saCx38rdIL6ih0wDaQWjoxlGwjSpS8",
  authDomain: "geroyado-oshinagaki.firebaseapp.com",
  databaseURL: "https://geroyado-oshinagaki-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "geroyado-oshinagaki",
  storageBucket: "geroyado-oshinagaki.firebasestorage.app",
  messagingSenderId: "389593436209",
  appId: "1:389593436209:web:40b819f3e0b9821aed0510"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const auth = getAuth(app);
await signInAnonymously(auth).catch((e) => console.error('匿名認証エラー:', e));
const currentUid = auth.currentUser ? auth.currentUser.uid : 'unknown';

// 未保存の変更があるかどうか（離脱時警告・読み込み完了フラグに使用）
let hasUnsavedChanges = false;
let initialLoadDone = false;
window.addEventListener('beforeunload', (e) => {
  if (hasUnsavedChanges) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// 今日の日付
const today = new Date();
const dateKey = today.getFullYear() + '-'
  + String(today.getMonth()+1).padStart(2,'0') + '-'
  + String(today.getDate()).padStart(2,'0');

// 旧暦月名
const kanjiMonths = ['睦月','如月','弥生','卯月','皐月','水無月','文月','葉月','長月','神無月','霜月','師走'];
const kanjiMonthNums = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
const kanjiDays = ['','一','二','三','四','五','六','七','八','九','十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
  '二十一','二十二','二十三','二十四','二十五','二十六','二十七','二十八','二十九','三十','三十一'];

document.getElementById('headerDate').textContent =
  kanjiMonthNums[today.getMonth()] + '月' + kanjiDays[today.getDate()] + '日（' + dateKey + '）';

// 料理区分定義
const GENRES = [
  { key: 'sakizuke',   name: '料理1',  isRaku: false },
  { key: 'wankawari',  name: '料理2',  isRaku: false },
  { key: 'tsukuri',    name: '料理3',  isRaku: false },
  { key: 'rakumori',   name: '楽盛り', isRaku: true,  rakulen: 9 },
  { key: 'yakimono',   name: '料理4',  isRaku: false },
  { key: 'futamono',   name: '料理5',  isRaku: false },
  { key: 'shizakana',  name: '料理6',  isRaku: false },
  { key: 'shokuji',    name: '料理7',  isRaku: false },
  { key: 'konomono',   name: '料理8',  isRaku: false },
  { key: 'tomewan',    name: '料理9',  isRaku: false },
  { key: 'kuchidori',  name: '料理10', isRaku: false },
  { key: 'hida',       name: '料理11', isRaku: false },
];

const COURSES = ['yuki','tsuki','hana','hida','yuki_2','tsuki_2','hana_2','hida_2'];
const COURSE_NAMES = { yuki:'雪', tsuki:'月', hana:'花', hida:'飛騨牛', yuki_2:'雪(連泊)', tsuki_2:'月(連泊)', hana_2:'花(連泊)', hida_2:'飛騨牛(連泊)' };

// メモリ上のデータ
let memData = { status: 'draft', courses: {} };
COURSES.forEach(c => { memData.courses[c] = {}; });

let currentCourse = 'yuki';
let isConfirmed = false;

// 60日以上前のデータを自動削除
(async function cleanOldData() {
  try {
    const rootSnap = await get(ref(db, 'daily'));
    if (!rootSnap.exists()) return;
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 60);
    const cutoffKey = cutoff.toISOString().slice(0, 10);
    const removes = [];
    rootSnap.forEach(child => {
      if (child.key < cutoffKey) removes.push(remove(ref(db, `daily/${child.key}`)));
    });
    await Promise.all(removes);
  } catch(e) {}
})();

// Firebaseから読み込み（今日のデータがなければ前日分を引き継ぎ）
const dataRef = ref(db, `daily/${dateKey}`);
onValue(dataRef, async (snap) => {
  const val = snap.val();
  if (val) {
    // 今日のデータが存在する場合
    memData = val;
    if (!memData.courses) memData.courses = {};
    COURSES.forEach(c => { if (!memData.courses[c]) memData.courses[c] = {}; });
    isConfirmed = val.status === 'confirmed';
    updateStatusBadge();
    renderForm(currentCourse);
    finishInitialLoad();
  } else {
    // 今日のデータがない場合、前日データを探して引き継ぎ
    isConfirmed = false;
    let inherited = false;
    for (let i = 1; i <= 60; i++) {
      const prev = new Date(today);
      prev.setDate(prev.getDate() - i);
      const prevKey = prev.getFullYear() + '-'
        + String(prev.getMonth()+1).padStart(2,'0') + '-'
        + String(prev.getDate()).padStart(2,'0');
      const prevSnap = await get(ref(db, `daily/${prevKey}`));
      if (prevSnap.exists()) {
        const prevData = prevSnap.val();
        memData = {
          status: 'draft',
          courses: JSON.parse(JSON.stringify(prevData.courses || {}))
        };
        COURSES.forEach(c => { if (!memData.courses[c]) memData.courses[c] = {}; });
        inherited = true;
        showToast('📋 前日のデータを引き継ぎました');
        break;
      }
    }
    if (!inherited) {
      memData = { status: 'draft', courses: {} };
      COURSES.forEach(c => { memData.courses[c] = {}; });
    }
    updateStatusBadge();
    renderForm(currentCourse);
    finishInitialLoad();
  }
}, { onlyOnce: true });

// 読み込みが完了するまでは、上書き事故を防ぐため主要ボタンを無効化しておく。
// （読み込み中に保存ボタン等が押されると、空のmemDataで上書きしてしまう危険があるため）
function finishInitialLoad() {
  initialLoadDone = true;
  const notice = document.getElementById('loadingNotice');
  if (notice) notice.style.display = 'none';
  updateStatusBadge();
}

function updateStatusBadge() {
  const badge = document.getElementById('statusBadge');
  const btn   = document.getElementById('btnConfirm');
  const reopenBtn = document.getElementById('btnReopen');
  if (isConfirmed) {
    const confirmedAt = memData.confirmed_at
      ? new Date(memData.confirmed_at).toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'})
      : '';
    badge.textContent = '確定済み' + (confirmedAt ? '　' + confirmedAt + '確定' : '');
    badge.className = 'status-badge badge-confirmed';
    btn.textContent = '✅ 全ての献立を確定する';
    btn.style.display = 'none';
    if (reopenBtn) { reopenBtn.style.display = ''; reopenBtn.disabled = !initialLoadDone; }
    // 全フィールドを無効化
    document.querySelectorAll('.field-input').forEach(el => { el.disabled = true; });
    document.querySelectorAll('.raku-input').forEach(el => { el.disabled = true; });
    document.querySelectorAll('.btn-copy-small, .btn-delete-genre, .btn-copy, .btn-save, .btn-recover').forEach(el => { el.disabled = true; });
    const printedBadge = document.getElementById('badgePrinted');
    if (printedBadge) {
      if (memData.printed_at) {
        const pt = new Date(memData.printed_at).toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
        printedBadge.textContent = '🖨 本日印刷済み（' + pt + '）';
        printedBadge.style.display = '';
      } else {
        printedBadge.style.display = 'none';
      }
    }
  } else {
    badge.textContent = '未確定';
    badge.className = 'status-badge badge-draft';
    btn.textContent = '✅ 全ての献立を確定する';
    btn.style.display = '';
    btn.disabled = !initialLoadDone;
    if (reopenBtn) reopenBtn.style.display = 'none';
    // 読み込みが完了している場合のみ、全フィールド・ボタンを有効化
    document.querySelectorAll('.field-input').forEach(el => { el.disabled = !initialLoadDone; });
    document.querySelectorAll('.raku-input').forEach(el => { el.disabled = !initialLoadDone; });
    document.querySelectorAll('.btn-copy-small, .btn-delete-genre, .btn-copy, .btn-save, .btn-recover').forEach(el => { el.disabled = !initialLoadDone; });
    const printedBadge2 = document.getElementById('badgePrinted');
    if (printedBadge2) printedBadge2.style.display = 'none';
  }
}

// フォーム描画
function renderForm(course) {
  const area = document.getElementById('formArea');
  area.innerHTML = '';
  const courseData = memData.courses[course] || {};
  // 連泊コース（_2）は楽盛りを提供しないため、楽盛りカードは表示しない
  const genres = GENRES.filter(g => !(g.isRaku && course.endsWith('_2')));

  genres.forEach(genre => {
    const card = document.createElement('div');
    card.className = 'genre-card';

    const gd = courseData[genre.key] || {};

    // ヘッダー
    const header = document.createElement('div');
    header.className = 'genre-header';
    header.innerHTML = `<span class="genre-name">${genre.name}</span>`;

    // コピーボタン・削除ボタン
    {
      const copyBtns = document.createElement('div');
      copyBtns.className = 'copy-btns';

      // コース別コピー先定義
      const COPY_TARGETS = {
        yuki:    ['tsuki','hana','hida'],
        tsuki:   ['hana'],
        hana:    [],
        hida:    [],
        yuki_2:  ['tsuki_2','hana_2','hida_2'],
        tsuki_2: ['hana_2'],
        hana_2:  [],
        hida_2:  [],
      };
      const targets = COPY_TARGETS[course] || [];
      targets.forEach(to => {
        const btn = document.createElement('button');
        btn.className = 'btn-copy-small';
        btn.textContent = COURSE_NAMES[to] + 'へコピー';
        btn.onclick = () => copyGenre(genre.key, course, to);
        copyBtns.appendChild(btn);
      });

      // 削除ボタン（楽盛り以外）
      if (!genre.isRaku) {
        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete-genre';
        delBtn.textContent = '🗑 この料理を削除';
        delBtn.onclick = () => deleteGenre(genre.key);
        copyBtns.appendChild(delBtn);
      }

      header.appendChild(copyBtns);
    }
    card.appendChild(header);

    // ボディ
    const body = document.createElement('div');
    body.className = 'genre-body';

    if (genre.isRaku) {
      // 楽盛り（rakumori_a: 0-4, rakumori_b: 5-8）
      const raA = (memData.courses[currentCourse]['rakumori_a'] || {}).items || [];
      const raB = (memData.courses[currentCourse]['rakumori_b'] || {}).items || [];
      const items = [...raA, ...raB].concat(Array(genre.rakulen).fill('')).slice(0, genre.rakulen);
      const list = document.createElement('div');
      list.className = 'raku-list';
      for (let i = 0; i < genre.rakulen; i++) {
        const row = document.createElement('div');
        row.className = 'raku-item-row';
        row.innerHTML = `<div class="raku-num">${i+1}</div>`;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'raku-input';
        input.value = items[i] || '';
        input.dataset.genre = genre.key;
        input.dataset.idx   = i;
        input.addEventListener('input', onRakuInput);
        row.appendChild(input);
        list.appendChild(row);
      }
      body.appendChild(list);
    } else {
      // 通常
      [['label','品名'],['menu','料理名'],['detail1','補足1'],['detail2','補足2']].forEach(([key, lbl]) => {
        const row = document.createElement('div');
        row.className = 'field-row';
        row.innerHTML = `<span class="field-label">${lbl}</span>`;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'field-input';
        input.value = gd[key] || '';
        if (key === 'label') {
          input.placeholder = genre.name;  // デフォルトラベルをプレースホルダーに
        }
        if (key === 'detail1' || key === 'detail2') {
          input.maxLength = 17;
          input.placeholder = '17文字以内で入力してください';
        }
        input.dataset.genre = genre.key;
        input.dataset.field = key;
        input.addEventListener('input', onFieldInput);
        row.appendChild(input);
        body.appendChild(row);
      });
    }

    card.appendChild(body);
    area.appendChild(card);
  });

  // 確定済み時はフィールドを無効化
  if (isConfirmed) {
    document.querySelectorAll('.field-input').forEach(el => { el.disabled = true; });
    document.querySelectorAll('.raku-input').forEach(el => { el.disabled = true; });
    document.querySelectorAll('.btn-copy-small, .btn-delete-genre, .btn-copy, .btn-save, .btn-recover').forEach(el => { el.disabled = true; });
  }
}

// 入力イベント
function onFieldInput(e) {
  const { genre, field } = e.target.dataset;
  if (!memData.courses[currentCourse][genre]) memData.courses[currentCourse][genre] = {};
  memData.courses[currentCourse][genre][field] = e.target.value;
  hasUnsavedChanges = true;
}

function onRakuInput(e) {
  const { genre, idx } = e.target.dataset;
  const i = parseInt(idx);
  const c = currentCourse;
  if (!memData.courses[c]['rakumori_a']) memData.courses[c]['rakumori_a'] = { items: [] };
  if (!memData.courses[c]['rakumori_b']) memData.courses[c]['rakumori_b'] = { items: [] };
  if (i < 5) {
    if (!memData.courses[c]['rakumori_a'].items) memData.courses[c]['rakumori_a'].items = [];
    memData.courses[c]['rakumori_a'].items[i] = e.target.value;
  } else {
    if (!memData.courses[c]['rakumori_b'].items) memData.courses[c]['rakumori_b'].items = [];
    memData.courses[c]['rakumori_b'].items[i - 5] = e.target.value;
  }
  hasUnsavedChanges = true;
}

// グループ・タブ切り替え
let currentGroup = 'normal';
const GROUP_COURSES = {
  normal: ['yuki','tsuki','hana','hida'],
  renp:   ['yuki_2','tsuki_2','hana_2','hida_2'],
};
const TAB_IDS = ['tab-yuki','tab-tsuki','tab-hana','tab-hida'];
const BASE_KEYS = ['yuki','tsuki','hana','hida'];

window.switchGroup = function(group, el) {
  currentGroup = group;
  document.querySelectorAll('.group-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  // コースタブのラベルを切り替え
  const suffix = group === 'renp' ? '【連泊】' : '';
  const names  = ['雪','月','花','飛騨牛'];
  TAB_IDS.forEach((id, i) => {
    const tab = document.getElementById(id);
    if (tab) tab.textContent = names[i] + 'コース' + suffix;
  });
  // アクティブタブのコースキーを更新
  const prefix = group === 'renp' ? '_2' : '';
  const activeBase = BASE_KEYS[TAB_IDS.findIndex(id => document.getElementById(id)?.classList.contains('active'))] || 'yuki';
  currentCourse = activeBase + prefix;
  renderForm(currentCourse);
};

window.switchTab = function(baseKey, el) {
  const prefix = currentGroup === 'renp' ? '_2' : '';
  currentCourse = baseKey + prefix;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderForm(currentCourse);
};

// ---- 保存まわりの共通処理 ----

// メモリ上のデータに、実際に入力されている項目がいくつあるかを数える。
// （保存直前に「サーバー上の内容」と比較し、大幅に減っていないかを確認するために使う）
function countContent(data) {
  let n = 0;
  const courses = (data && data.courses) || {};
  Object.values(courses).forEach(course => {
    Object.values(course || {}).forEach(genre => {
      if (!genre) return;
      if (Array.isArray(genre.items)) {
        genre.items.forEach(v => { if (v && String(v).trim()) n++; });
      } else {
        ['label','menu','detail1','detail2'].forEach(k => {
          if (genre[k] && String(genre[k]).trim()) n++;
        });
      }
    });
  });
  return n;
}

// 保存操作のたびに、日時とUIDだけをhistoryに追記する（②の対応）
async function logSaveHistory() {
  try {
    await push(ref(db, `history/${dateKey}`), {
      savedAt: ServerValue.TIMESTAMP,
      savedBy: currentUid
    });
  } catch (e) {
    // ログの記録に失敗しても、本体の保存自体は既に完了しているため握りつぶす
    console.error('保存履歴の記録に失敗しました:', e);
  }
}

// 実際にFirebaseへ書き込む処理（①②共通）
async function writeToDb() {
  await set(ref(db, `daily/${dateKey}`), memData);
  hasUnsavedChanges = false;
  await logSaveHistory();
}

// 保存前に、サーバー上の現在の内容と比較する。
// 大幅に内容が減っている場合は、上書き事故の可能性があるため確認を挟む（①の対応）
// actionLabel：警告ダイアログのボタン文言に使う操作名（例：「保存」「確定」「確定解除」）
// 戻り値：実際に保存が行われた場合は true、キャンセルされた場合は false
async function performSave(actionLabel) {
  actionLabel = actionLabel || '保存';
  let serverData = null;
  try {
    const serverSnap = await get(ref(db, `daily/${dateKey}`));
    serverData = serverSnap.exists() ? serverSnap.val() : null;
  } catch (e) {
    console.error('保存前の最新データ取得に失敗しました:', e);
    // 取得自体に失敗した場合は、比較チェックをスキップしてそのまま保存に進む
    await writeToDb();
    return true;
  }
  const serverCount = countContent(serverData);
  const localCount  = countContent(memData);
  if (serverData && serverCount >= 3 && localCount < serverCount * 0.5) {
    return await new Promise((resolve) => {
      showDialog(
        '⚠️ 内容が大きく減っています',
        `サーバー上のデータには${serverCount}件の入力がありますが、${actionLabel}しようとしている内容は${localCount}件しかありません。\n他の端末での変更を上書きしてしまう可能性があります。`,
        async () => { await writeToDb(); resolve(true); },
        () => { showToast(`❌ ${actionLabel}をキャンセルしました（内容は変更されていません）`); resolve(false); },
        `そのまま${actionLabel}する`,
        'キャンセル'
      );
    });
  } else {
    await writeToDb();
    return true;
  }
}

// 一時保存
window.saveData = async function() {
  memData.status = isConfirmed ? 'confirmed' : 'draft';
  const ok = await performSave('保存');
  if (ok) showToast('💾 保存しました');
  return ok;
};

// 確定
window.confirmAll = function() {
  showDialog(
    '献立を確定しますか？',
    '確定するとフロントが印刷可能になります。\nあとから変更する場合は確定を解除してください。',
    async () => {
      const prevStatus = memData.status;
      const prevConfirmedAt = memData.confirmed_at;
      const prevPrintedAt = memData.printed_at;
      memData.status = 'confirmed';
      memData.confirmed_at = new Date().toISOString();
      memData.printed_at = null;
      const ok = await performSave('確定');
      if (ok) {
        isConfirmed = true;
        updateStatusBadge();
        showToast('✅ 献立を確定しました');
      } else {
        // キャンセルされた場合は、メモリ上の変更も元に戻し、確定扱いにしない
        memData.status = prevStatus;
        memData.confirmed_at = prevConfirmedAt;
        memData.printed_at = prevPrintedAt;
      }
    },
    null,
    '確定する',
    'キャンセル'
  );
};

// 確定解除
window.reopenAll = function() {
  showDialog(
    '確定を解除しますか？',
    '未確定状態に戻します。フロントへの通知も解除されます。\n編集後に再度確定してください。',
    async () => {
      const prevStatus = memData.status;
      const prevConfirmedAt = memData.confirmed_at;
      memData.status = 'draft';
      memData.confirmed_at = null;
      const ok = await performSave('確定解除');
      if (ok) {
        isConfirmed = false;
        updateStatusBadge();
        showToast('✏️ 確定を解除しました');
      } else {
        memData.status = prevStatus;
        memData.confirmed_at = prevConfirmedAt;
      }
    },
    null,
    '解除する',
    'キャンセル'
  );
};

// 前日のデータを復旧（③の対応）
// 自動保存はせず、画面上のデータを差し替えるだけに留める。内容を確認したうえで
// あらためて「一時保存」を押してもらう想定。
window.recoverPreviousData = function() {
  showDialog(
    '前日のデータを復旧しますか？',
    '直近に保存されている記録を取得し、現在の入力内容を置き換えます。\n置き換え後は内容をご確認のうえ、あらためて保存してください。\n（この操作自体では、まだFirebaseには保存されません）',
    async () => {
      let found = null, foundKey = null;
      for (let i = 1; i <= 60; i++) {
        const prev = new Date(today);
        prev.setDate(prev.getDate() - i);
        const prevKey = prev.getFullYear() + '-'
          + String(prev.getMonth()+1).padStart(2,'0') + '-'
          + String(prev.getDate()).padStart(2,'0');
        let prevSnap;
        try {
          prevSnap = await get(ref(db, `daily/${prevKey}`));
        } catch (e) {
          console.error('過去データの取得に失敗しました:', e);
          continue;
        }
        if (prevSnap.exists()) { found = prevSnap.val(); foundKey = prevKey; break; }
      }
      if (!found) {
        showToast('⚠️ 復旧できる過去データが見つかりませんでした');
        return;
      }
      memData = {
        status: 'draft',
        courses: JSON.parse(JSON.stringify(found.courses || {}))
      };
      COURSES.forEach(c => { if (!memData.courses[c]) memData.courses[c] = {}; });
      isConfirmed = false;
      hasUnsavedChanges = true;
      updateStatusBadge();
      renderForm(currentCourse);
      showToast(`📅 ${foundKey}のデータを画面に反映しました（まだ保存されていません）`);
    },
    null,
    '反映する',
    'キャンセル'
  );
};

// 単一区分コピー
window.copyGenre = async function(genreKey, from, to) {
  if (!memData.courses[to]) memData.courses[to] = {};
  // 楽盛りはrakumori_a/rakumori_bの2キーをコピー
  if (genreKey === 'rakumori') {
    ['rakumori_a','rakumori_b'].forEach(k => {
      if (memData.courses[from][k]) {
        memData.courses[to][k] = JSON.parse(JSON.stringify(memData.courses[from][k]));
      }
    });
  } else {
    if (!memData.courses[from][genreKey]) return;
    memData.courses[to][genreKey] = JSON.parse(JSON.stringify(memData.courses[from][genreKey]));
  }
  const ok = await window.saveData();
  if (ok) showToast(`📋 ${COURSE_NAMES[to]}コースにコピーしました`);
  renderForm(currentCourse);
};

window.deleteGenre = function(genreKey) {
  if (!memData.courses[currentCourse]) return;
  memData.courses[currentCourse][genreKey] = { label:'', menu:'', detail1:'', detail2:'' };
  hasUnsavedChanges = true;
  renderForm(currentCourse);
  showToast('🗑 削除しました');
};

// ダイアログ
// onCancel・okLabel・cancelLabel は省略可能
// （okLabel省略時は「はい」、cancelLabel省略時は「キャンセル」）
function showDialog(title, msg, onOk, onCancel, okLabel, cancelLabel) {
  document.getElementById('dialogTitle').textContent = title;
  document.getElementById('dialogMsg').textContent = msg;
  document.getElementById('dialogOk').textContent = okLabel || 'はい';
  document.getElementById('dialogCancel').textContent = cancelLabel || 'キャンセル';
  document.getElementById('dialogOk').onclick = () => { closeDialog(); onOk(); };
  document.getElementById('dialogCancel').onclick = () => { closeDialog(); if (onCancel) onCancel(); };
  document.getElementById('overlay').classList.add('show');
}
window.closeDialog = function() {
  document.getElementById('overlay').classList.remove('show');
};

// トースト
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
