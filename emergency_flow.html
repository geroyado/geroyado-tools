<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>緊急時対応フロー — 下呂観光ホテル</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f2ed;
    --bg-card: #ffffff;
    --bg-secondary: #f0ede8;
    --text-primary: #1a1a1a;
    --text-secondary: #5a5a5a;
    --text-tertiary: #8a8a8a;
    --border: rgba(0,0,0,0.12);
    --border-med: rgba(0,0,0,0.22);
    --radius-md: 8px;
    --radius-lg: 12px;
    --header-bg: #1a2332;
    --header-text: #e8ecf0;
    --font: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --bg-card: #1e1e1e;
      --bg-secondary: #252525;
      --text-primary: #e8e8e8;
      --text-secondary: #aaaaaa;
      --text-tertiary: #666666;
      --border: rgba(255,255,255,0.10);
      --border-med: rgba(255,255,255,0.18);
    }
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  #app {
    width: 100%;
    max-width: 640px;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    overflow: hidden;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
  }

  .header {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-icon {
    width: 32px; height: 32px;
    background: #c0392b;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #fff; font-weight: 700; flex-shrink: 0;
  }
  .header h1 { font-size: 15px; font-weight: 500; margin-bottom: 2px; }
  .header-sub { font-size: 11px; color: #8fa3bb; }

  .breadcrumb {
    padding: 8px 20px;
    background: var(--bg-secondary);
    border-bottom: 0.5px solid var(--border);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    min-height: 38px;
  }
  .bc-item { font-size: 11px; color: var(--text-secondary); }
  .bc-item.current { color: var(--text-primary); font-weight: 500; }
  .bc-sep { color: var(--text-tertiary); font-size: 10px; }

  .content { padding: 20px; }

  .question-lead {
    font-size: 11px; color: var(--text-secondary);
    letter-spacing: 0.05em; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .question {
    font-size: 16px; font-weight: 500;
    color: var(--text-primary); line-height: 1.5;
    margin-bottom: 18px;
  }

  .choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .choice-btn {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: var(--bg-card);
    border: 0.5px solid var(--border-med);
    border-radius: var(--radius-md);
    cursor: pointer; text-align: left; width: 100%;
    transition: background 0.12s, border-color 0.12s;
  }
  .choice-btn:hover { background: var(--bg-secondary); border-color: var(--border-med); }
  .choice-icon {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .ci-red    { background: #FCEBEB; color: #A32D2D; }
  .ci-amber  { background: #FAEEDA; color: #854F0B; }
  .ci-blue   { background: #E6F1FB; color: #185FA5; }
  .ci-teal   { background: #E1F5EE; color: #0F6E56; }
  .ci-gray   { background: #F1EFE8; color: #5F5E5A; }
  .choice-label { font-size: 13px; font-weight: 500; color: var(--text-primary); }
  .choice-desc  { font-size: 11px; color: var(--text-secondary); margin-top: 2px; line-height: 1.4; }

  .complete-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: #EAF3DE; color: #3B6D11;
    border-radius: 20px; padding: 4px 12px;
    font-size: 11px; font-weight: 500; margin-bottom: 14px;
  }

  .warning-box {
    background: #FAEEDA; border: 0.5px solid #FAC775;
    border-radius: var(--radius-md);
    padding: 10px 14px; margin-bottom: 14px;
    font-size: 12px; color: #633806; line-height: 1.6;
  }

  .action-card {
    border-radius: var(--radius-md);
    border: 0.5px solid var(--border);
    overflow: hidden; margin-bottom: 12px;
  }
  .action-header {
    padding: 10px 14px;
    font-size: 12px; font-weight: 500; letter-spacing: 0.03em;
  }
  .ah-red   { background: #FCEBEB; color: #A32D2D; }
  .ah-amber { background: #FAEEDA; color: #854F0B; }
  .ah-blue  { background: #E6F1FB; color: #185FA5; }
  .ah-teal  { background: #E1F5EE; color: #0F6E56; }

  .action-steps { padding: 12px 14px; background: var(--bg-card); }
  .action-step { display: flex; gap: 10px; margin-bottom: 10px; }
  .action-step.dimmed { opacity: 0.38; }
  .action-step.dimmed .step-num { border-style: dashed; }
  .action-step:last-child { margin-bottom: 0; }
  .step-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--bg-secondary);
    border: 0.5px solid var(--border-med);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 500; flex-shrink: 0;
    color: var(--text-secondary);
  }
  .step-body { padding-top: 2px; }
  .step-text { font-size: 13px; color: var(--text-primary); line-height: 1.6; }
  .step-text strong { font-weight: 500; }
  .step-note { font-size: 11px; color: var(--text-secondary); margin-top: 3px; line-height: 1.4; }

  .tel-box {
    background: var(--bg-secondary);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    display: flex; flex-wrap: wrap; gap: 16px;
    margin-bottom: 14px;
  }
  .tel-item { display: flex; flex-direction: column; }
  .tel-label { font-size: 10px; color: var(--text-secondary); letter-spacing: 0.04em; margin-bottom: 2px; }
  .tel-num   { font-size: 16px; font-weight: 500; color: var(--text-primary); }
  .tel-note  { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }

  .nav-row { display: flex; gap: 8px; margin-top: 18px; }
  .btn-back {
    padding: 8px 16px;
    background: transparent;
    border: 0.5px solid var(--border-med);
    border-radius: var(--radius-md);
    font-size: 12px; color: var(--text-secondary);
    cursor: pointer; font-family: var(--font);
  }
  .btn-back:hover { background: var(--bg-secondary); }
  .btn-restart {
    padding: 8px 16px;
    background: var(--header-bg);
    border: none;
    border-radius: var(--radius-md);
    font-size: 12px; color: #e8ecf0;
    cursor: pointer; margin-left: auto;
    font-family: var(--font);
  }
  .btn-restart:hover { opacity: 0.85; }

  .footer {
    margin-top: 20px;
    font-size: 11px; color: var(--text-tertiary);
    text-align: center; line-height: 1.8;
  }

  @media (max-width: 480px) {
    body { padding: 0 0 40px; }
    #app { border-radius: 0; border-left: none; border-right: none; }
  }
</style>
</head>

      {n:2, text:"責任者の指示に従って対応する"},

let history = [];
let currentNode = "start";

function render() {
  renderBreadcrumb();
  if (FLOW[currentNode]) renderChoices(FLOW[currentNode]);
}

function renderBreadcrumb() {
  const bc = document.getElementById("breadcrumb");
  const labels = ["トップ", ...history.map(h => h.label)];
  bc.innerHTML = labels.map((l, i) => {
    const last = i === labels.length - 1;
    return `<span class="bc-item${last?' current':''}">${l}</span>${!last?'<span class="bc-sep">›</span>':''}`;
  }).join("");
}

function renderChoices(node) {
  const c = document.getElementById("content");
  const colorMap = {red:"ci-red", amber:"ci-amber", blue:"ci-blue", teal:"ci-teal", gray:"ci-gray"};
  c.innerHTML = `
    <div class="question-lead">${node.lead || "状況を選択"}</div>
    <div class="question">${node.question}</div>
    <div class="choices">
      ${node.choices.map(ch => `
        <button class="choice-btn" onclick="choose('${ch.id}','${ch.label.replace(/'/g,"\\'")}')">
          <div class="choice-icon ${colorMap[ch.color]||'ci-gray'}">${ch.icon||"▶"}</div>
          <div>
            <div class="choice-label">${ch.label}</div>
            ${ch.desc?`<div class="choice-desc">${ch.desc}</div>`:""}
          </div>
        </button>`).join("")}
    </div>
    ${history.length>0?`<div class="nav-row"><button class="btn-back" onclick="goBack()">← 戻る</button><button class="btn-restart" onclick="restart()">最初から</button></div>`:""}
  `;
}

function stepsHtml(steps, dimmed) {
  return steps.map(s=>`
    <div class="action-step${dimmed?' dimmed':''}">
      <div class="step-num">${s.n}</div>
      <div class="step-body">
        <div class="step-text">${s.text}</div>
        ${s.note?`<div class="step-note">${s.note}</div>`:""}
      </div>
    </div>`).join("");
}

function renderAction(id, branchKey) {
  const a = ACTIONS[id];
  if (!a) return;
  const c = document.getElementById("content");

  const hasBranch = !!a.branch;
  const branchSelected = hasBranch && branchKey;
  const branchData = branchSelected ? a.branch[branchKey] : null;

  const colorMap = { teal:"#E1F5EE", tealText:"#0F6E56", tealBorder:"#5DCAA5", amber:"#FAEEDA", amberText:"#854F0B", amberBorder:"#EF9F27", gray:"#F1EFE8", grayText:"#5F5E5A", grayBorder:"#B4B2A9" };

  const branchBlock = hasBranch && !branchSelected ? `
    <div style="margin:14px 0 4px;">
      <div class="question-lead" style="margin-bottom:8px;">${a.branch.question}</div>
      <div class="choices">
        <button class="choice-btn" onclick="chooseBranch('${id}','yes')">
          <div class="choice-icon ci-teal">○</div>
          <div><div class="choice-label">${a.branch.yes.label}</div></div>
        </button>
        ${a.branch.done ? `
        <button class="choice-btn" onclick="chooseBranch('${id}','done')">
          <div class="choice-icon ci-amber">!</div>
          <div><div class="choice-label">${a.branch.done.label}</div></div>
        </button>` : ""}
        <button class="choice-btn" onclick="chooseBranch('${id}','no')">
          <div class="choice-icon ci-gray">✕</div>
          <div><div class="choice-label">${a.branch.no.label}</div></div>
        </button>
      </div>
    </div>` : "";

  const dividerHtml = branchSelected && branchData ? (() => {
    const col = branchData.badgeColor || "gray";
    const bg = colorMap[col] || colorMap.gray;
    const tx = colorMap[col+"Text"] || colorMap.grayText;
    const br = colorMap[col+"Border"] || colorMap.grayBorder;
    return `
      <div style="display:flex;align-items:center;gap:10px;margin:4px 0;">
        <div style="width:22px;flex-shrink:0;"></div>
        <div style="flex:1;border-left:2px solid ${br};padding:6px 10px;
          background:${bg};border-radius:0 var(--radius-md) var(--radius-md) 0;
          font-size:11px;font-weight:500;color:${tx};">
          ${branchData.badge}
        </div>
      </div>`;
  })() : "";

  const preStepsHtml  = stepsHtml(a.steps, branchSelected);
  const postStepsHtml = branchSelected && branchData ? stepsHtml(branchData.steps, false) : "";

  c.innerHTML = `
    <div class="complete-badge">● 対応手順</div>
    ${a.warning?`<div class="warning-box">⚠ ${a.warning}</div>`:""}
    <div class="action-card">
      <div class="action-header ${a.color}">${a.title}</div>
      <div class="action-steps">
        ${preStepsHtml}
        ${dividerHtml}
        ${postStepsHtml}
      </div>
    </div>
    ${branchBlock}
    ${(!hasBranch || branchSelected) && a.tel ? `
    <div class="tel-box">
      ${a.tel.map(t=>`
        <div class="tel-item">
          <div class="tel-label">${t.label}</div>
          <div class="tel-num">${t.num}</div>
          ${t.note?`<div class="tel-note">${t.note}</div>`:""}
        </div>`).join("")}
    </div>`:""}
    <div class="nav-row">
      <button class="btn-back" onclick="goBack()">← 戻る</button>
      <button class="btn-restart" onclick="restart()">最初から</button>
    </div>
  `;
}

function chooseBranch(id, key) {
  const a = ACTIONS[id];
  const label = a && a.branch && a.branch[key] ? a.branch[key].label : key;
  history.push({ node: id, label: label, branchKey: key });
  renderBreadcrumb();
  renderAction(id, key);
}

function choose(id, label) {
  history.push({ node: currentNode, label: label });
  if (FLOW[id]) {
    currentNode = id;
    render();
  } else {
    currentNode = id;
    renderBreadcrumb();
    renderAction(id);
  }
}

function goBack() {
  if (!history.length) return;
  const prev = history.pop();
  currentNode = prev.node;
  if (FLOW[currentNode]) render();
  else {
    const parentBranch = history.length ? history[history.length-1].branchKey : null;
    renderBreadcrumb();
    renderAction(currentNode, parentBranch || null);
  }
}

function restart() {
  history = [];
  currentNode = "start";
  render();
}

render();
</script>
