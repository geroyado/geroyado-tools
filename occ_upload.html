<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>稼働率アップロード（管理者）</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #0d0f14;
  --surface: #161920;
  --surface2: #1e2230;
  --border: #272c3f;
  --text: #dde1ed;
  --dim: #6b7494;
  --accent: #4f8ef7;
  --green: #22c55e;
  --red: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans','Yu Gothic UI',sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 48px 20px 80px;
}

.header {
  width: 100%; max-width: 560px;
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 40px;
}
.header-icon {
  width: 38px; height: 38px; border-radius: 9px;
  background: linear-gradient(135deg,#4f8ef7,#818cf8);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.header h1 { font-size: 16px; font-weight: 700; }
.header .sub { font-size: 11px; color: var(--dim); margin-top: 2px; }
.back { margin-left: auto; font-size: 12px; color: var(--dim);
  text-decoration: none; padding: 5px 12px;
  border: 1px solid var(--border); border-radius: 6px;
  transition: .2s; }
.back:hover { color: var(--text); border-color: var(--accent); }

.card {
  width: 100%; max-width: 560px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
}

/* ドロップゾーン */
#drop-zone {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 48px 24px;
  text-align: center;
  cursor: pointer;
  transition: .25s;
  margin-bottom: 24px;
}
#drop-zone.over { border-color: var(--accent); background: #131829; }
#drop-zone .icon { font-size: 40px; margin-bottom: 14px; }
#drop-zone .title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
#drop-zone .sub { font-size: 12px; color: var(--dim); }
.pick-btn {
  display: inline-block; margin-top: 16px;
  padding: 7px 20px; background: var(--accent);
  color: #fff; border-radius: 8px;
  font-size: 12px; font-weight: 600; cursor: pointer;
}
#file-input { display: none; }

/* ファイル選択済み */
#file-bar {
  display: none;
  align-items: center; gap: 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 20px;
  font-size: 13px;
}
#file-bar .fname { font-weight: 600; flex: 1; }
#file-bar .fsize { color: var(--dim); font-size: 11px; }
#file-bar .clr { background: none; border: none; color: var(--dim);
  cursor: pointer; font-size: 15px; padding: 2px 6px;
  border-radius: 4px; transition: .2s; }
#file-bar .clr:hover { color: var(--red); }

/* プレビュー */
#preview-wrap {
  display: none;
  margin-bottom: 24px;
}
#preview-wrap .prev-label {
  font-size: 11px; font-weight: 700; letter-spacing: .06em;
  color: var(--dim); margin-bottom: 10px; text-transform: uppercase;
}
.prev-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 10px; margin-bottom: 14px;
}
.prev-stat {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px;
}
.prev-stat .ps-label { font-size: 10px; color: var(--dim); margin-bottom: 4px; }
.prev-stat .ps-val { font-size: 18px; font-weight: 800; }
.prev-table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
.prev-table { border-collapse: collapse; width: 100%; font-size: 11px; min-width: 500px; }
.prev-table th {
  background: var(--surface2); padding: 6px 10px;
  text-align: center; font-weight: 700; color: var(--dim);
  border-bottom: 1px solid var(--border);
}
.prev-table td { padding: 5px 10px; text-align: center; border-bottom: 1px solid #1a1e2e; }
.prev-table tr:last-child td { border-bottom: none; }

/* アップロードボタン */
#upload-btn {
  width: 100%; padding: 13px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 10px;
  font-size: 14px; font-weight: 700;
  cursor: pointer; transition: .2s;
  display: none;
}
#upload-btn:hover { background: #3a7de8; }
#upload-btn:disabled { background: #2a3a5a; color: var(--dim); cursor: default; }

/* ステータス */
#status {
  display: none;
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
}
#status.ok { background: #0f2e1a; border: 1px solid #166534; color: var(--green); }
#status.err { background: #2e0f0f; border: 1px solid #7f1d1d; color: var(--red); }

/* 履歴 */
#history-wrap {
  width: 100%; max-width: 560px;
  margin-top: 28px;
}
#history-wrap h2 {
  font-size: 12px; font-weight: 700; letter-spacing: .06em;
  color: var(--dim); margin-bottom: 12px; text-transform: uppercase;
}
.hist-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 8px;
  font-size: 12px;
}
.hist-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.hist-label { font-weight: 600; flex: 1; }
.hist-meta { color: var(--dim); }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">⬆️</div>
  <div>
    <h1>稼働率アップロード</h1>
    <div class="sub">管理者専用 — タイプ台帳を読み込み・保存する</div>
  </div>
  <a class="back" href="index.html">← ポータル</a>
</div>

<div class="card">
  <div id="drop-zone">
    <div class="icon">📊</div>
    <div class="title">タイプ台帳をここにドロップ</div>
    <div class="sub">タイプ台帳*.xlsx をドラッグ＆ドロップ</div>
    <label class="pick-btn" for="file-input">ファイルを選択</label>
    <input type="file" id="file-input" accept=".xlsx,.xls">
  </div>

  <div id="file-bar">
    <span>📄</span>
    <span class="fname" id="fname"></span>
    <span class="fsize" id="fsize"></span>
    <button class="clr" id="clr-btn">✕</button>
  </div>

  <div id="preview-wrap">
    <div class="prev-label">読み込みプレビュー</div>
    <div class="prev-stats" id="prev-stats"></div>
    <div class="prev-table-wrap">
      <table class="prev-table" id="prev-table">
        <thead id="prev-thead"></thead>
        <tbody id="prev-tbody"></tbody>
      </table>
    </div>
  </div>

  <button id="upload-btn">✅ この内容で保存・公開する</button>
  <div id="status"></div>
</div>

<div id="history-wrap">
  <h2>アップロード履歴</h2>
  <div id="history-list"></div>
</div>

<script>
const ROOM_TYPES = ['和室','2Fツイン','3Fツイン','4Fツイン','3階露天付','4階露天付','特別室'];
const DOW = ['日','月','火','水','木','金','土'];
const STORAGE_KEY = 'occ_data_v1';
const HISTORY_KEY = 'occ_history_v1';

let parsedData = null;

// D&D
const zone = document.getElementById('drop-zone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
zone.addEventListener('dragleave', () => zone.classList.remove('over'));
zone.addEventListener('drop', e => {
  e.preventDefault(); zone.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) processFile(f);
});
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) processFile(e.target.files[0]);
});
document.getElementById('clr-btn').addEventListener('click', reset);
document.getElementById('upload-btn').addEventListener('click', saveData);

function processFile(file) {
  if (!/\.(xlsx|xls)$/i.test(file.name)) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false });
      const data = parseRows(rows);
      if (data.length === 0) throw new Error('データが読み取れませんでした');
      parsedData = { data, filename: file.name, parsedAt: new Date().toISOString() };
      showFileBar(file);
      showPreview(data);
      document.getElementById('upload-btn').style.display = 'block';
      hideStatus();
    } catch(err) {
      showStatus('err', '⚠ ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseRows(rows) {
  const result = [];
  const REMAIN = [2,3,4,5,6,7,8];
  const TOTAL  = [9,10,11,12,13,14,15];
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length < 10) continue;
    const date = parseDate(row[0]);
    if (!date) continue;
    const occs = [];
    let any = false;
    for (let t = 0; t < 7; t++) {
      const r = +row[REMAIN[t]] || 0;
      const tot = +row[TOTAL[t]] || 0;
      if (tot > 0) { occs.push((tot - r) / tot); any = true; }
      else occs.push(null);
    }
    if (!any) continue;
    const ar = REMAIN.reduce((s,c)=>s+(+row[c]||0),0);
    const at = TOTAL.reduce((s,c)=>s+(+row[c]||0),0);
    result.push({ date: date.getTime(), occs, overall: at>0?(at-ar)/at:null });
  }
  result.sort((a,b)=>a.date-b.date);
  return result;
}

function parseDate(v) {
  if (!v) return null;
  if (typeof v === 'number' && v > 40000) {
    const d = XLSX.SSF.parse_date_code(v);
    return d ? new Date(d.y, d.m-1, d.d) : null;
  }
  const s = String(v).trim().replace(/\//g,'-');
  if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)) return new Date(s);
  if (/^\d{1,2}-\d{1,2}$/.test(s)) {
    const [m,d] = s.split('-').map(Number);
    return new Date(new Date().getFullYear(), m-1, d);
  }
  return null;
}

function showFileBar(file) {
  document.getElementById('drop-zone').style.display = 'none';
  document.getElementById('fname').textContent = file.name;
  document.getElementById('fsize').textContent = (file.size/1024).toFixed(0)+' KB';
  document.getElementById('file-bar').style.display = 'flex';
}

function showPreview(data) {
  const wrap = document.getElementById('preview-wrap');
  wrap.style.display = 'block';

  // 統計
  const dates = data.map(d => new Date(d.date));
  const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
  const allOvr = data.map(d=>d.overall).filter(v=>v!==null);
  const avg = allOvr.reduce((s,v)=>s+v,0)/allOvr.length;

  document.getElementById('prev-stats').innerHTML = `
    <div class="prev-stat">
      <div class="ps-label">期間</div>
      <div class="ps-val" style="font-size:13px">${fmt(dates[0])}〜${fmt(dates[dates.length-1])}</div>
    </div>
    <div class="prev-stat">
      <div class="ps-label">日数</div>
      <div class="ps-val">${data.length}<span style="font-size:12px;font-weight:400">日</span></div>
    </div>
    <div class="prev-stat">
      <div class="ps-label">全体平均</div>
      <div class="ps-val">${pct(avg)}</div>
    </div>`;

  // 先頭5行プレビュー
  document.getElementById('prev-thead').innerHTML = `<tr>
    <th>日付</th><th>曜</th>${ROOM_TYPES.map(r=>`<th>${r}</th>`).join('')}<th>全体</th></tr>`;
  const tbody = document.getElementById('prev-tbody');
  tbody.innerHTML = '';
  data.slice(0,5).forEach(row => {
    const d = new Date(row.date);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${d.getMonth()+1}/${d.getDate()}</td><td>${DOW[d.getDay()]}</td>
      ${row.occs.map(v=>`<td>${v!==null?pct(v):'—'}</td>`).join('')}
      <td>${row.overall!==null?pct(row.overall):'—'}</td>`;
    tbody.appendChild(tr);
  });
  if (data.length > 5) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td colspan="${9+ROOM_TYPES.length}" style="color:#6b7494;text-align:center;padding:8px">… 残り ${data.length-5} 行</td>`;
    tbody.appendChild(tr);
  }
}

async function saveData() {
  if (!parsedData) return;
  const btn = document.getElementById('upload-btn');
  btn.disabled = true;
  btn.textContent = '保存中…';

  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(parsedData), true);

    // 履歴追加
    let hist = [];
    try { const r = await window.storage.get(HISTORY_KEY, true); if(r) hist = JSON.parse(r.value); } catch{}
    hist.unshift({ filename: parsedData.filename, savedAt: new Date().toISOString(), days: parsedData.data.length });
    if (hist.length > 5) hist = hist.slice(0,5);
    await window.storage.set(HISTORY_KEY, JSON.stringify(hist), true);

    showStatus('ok', '✅ 保存しました。閲覧ページに反映されました。');
    loadHistory();
  } catch(err) {
    showStatus('err', '⚠ 保存に失敗しました: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '✅ この内容で保存・公開する';
  }
}

async function loadHistory() {
  try {
    const r = await window.storage.get(HISTORY_KEY, true);
    if (!r) return;
    const hist = JSON.parse(r.value);
    const list = document.getElementById('history-list');
    list.innerHTML = '';
    hist.forEach(h => {
      const d = new Date(h.savedAt);
      const fmtd = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const el = document.createElement('div');
      el.className = 'hist-item';
      el.innerHTML = `<div class="hist-dot"></div>
        <div class="hist-label">${h.filename}</div>
        <div class="hist-meta">${h.days}日分 — ${fmtd}</div>`;
      list.appendChild(el);
    });
    document.getElementById('history-wrap').style.display = hist.length ? 'block' : 'none';
  } catch{}
}

function reset() {
  parsedData = null;
  document.getElementById('drop-zone').style.display = 'block';
  document.getElementById('file-bar').style.display = 'none';
  document.getElementById('preview-wrap').style.display = 'none';
  document.getElementById('upload-btn').style.display = 'none';
  document.getElementById('file-input').value = '';
  hideStatus();
}

function showStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.textContent = msg;
  el.style.display = 'block';
}
function hideStatus() { document.getElementById('status').style.display = 'none'; }
function pct(v) { return Math.round(v*100)+'%'; }

// 初期化
document.getElementById('history-wrap').style.display = 'none';
loadHistory();
</script>
</body>
</html>
