<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>部屋タイプ別 稼働率</title>
<style>
:root {
  --bg: #0d0f14;
  --surface: #161920;
  --surface2: #1e2230;
  --border: #272c3f;
  --text: #dde1ed;
  --dim: #6b7494;

  /* 稼働率カラー — 赤黄青白 */
  --c-danger: #3d0e0e;  /* ~29% 赤 */
  --c-warn:   #332200;  /* 30-49% 黄 */
  --c-good:   #0d2240;  /* 50-79% 青 */
  --c-full:   #1a2e1a;  /* 80%+  緑白 */

  --t-danger: #f87171;
  --t-warn:   #fbbf24;
  --t-good:   #60a5fa;
  --t-full:   #d1fae5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans','Yu Gothic UI',sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 32px 16px 80px;
}

header {
  display: flex; align-items: center; gap: 12px;
  max-width: 900px; margin: 0 auto 32px;
}
.logo {
  width: 38px; height: 38px; border-radius: 9px;
  background: linear-gradient(135deg,#f87171,#fbbf24);
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
header h1 { font-size: 17px; font-weight: 700; }
header .sub { font-size: 11px; color: var(--dim); margin-top: 2px; }
.back { margin-left: auto; font-size: 12px; color: var(--dim);
  text-decoration: none; padding: 5px 12px;
  border: 1px solid var(--border); border-radius: 6px; transition: .2s; }
.back:hover { color: var(--text); border-color: #f87171; }

/* メタバー */
#meta-bar {
  display: none;
  max-width: 900px; margin: 0 auto 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 12px;
  align-items: center; gap: 16px;
}
#meta-bar .mb-file { font-weight: 600; }
#meta-bar .mb-saved { color: var(--dim); }
#meta-bar .mb-badge {
  margin-left: auto;
  background: #0f2e1a; border: 1px solid #166534;
  color: #4ade80; font-size: 10px; font-weight: 700;
  padding: 2px 10px; border-radius: 20px;
  letter-spacing: .04em;
}

/* 空状態 */
#empty {
  max-width: 560px; margin: 80px auto 0;
  text-align: center;
}
#empty .empty-icon { font-size: 48px; margin-bottom: 20px; }
#empty h2 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
#empty p { font-size: 13px; color: var(--dim); }

/* 凡例 */
.legend {
  display: flex; gap: 16px; flex-wrap: wrap;
  max-width: 900px; margin: 0 auto 20px;
}
.leg { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dim); }
.leg-sw { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }

/* サマリーカード */
.summary {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px,1fr));
  gap: 10px;
  max-width: 900px; margin: 0 auto 28px;
}
.sc {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px;
}
.sc-label { font-size: 10px; color: var(--dim); margin-bottom: 5px; font-weight: 600; }
.sc-val { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.sc-sub { font-size: 10px; color: var(--dim); margin-top: 2px; }

/* テーブル */
.tbl-wrap {
  max-width: 900px; margin: 0 auto;
  overflow-x: auto;
  border-radius: 12px; border: 1px solid var(--border);
}
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 12px; }
thead th {
  background: var(--surface2); padding: 9px 12px;
  text-align: center; font-weight: 700; color: var(--dim);
  font-size: 11px; letter-spacing: .04em;
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
thead th:first-child, thead th:nth-child(2) { text-align: left; }

tbody tr { border-bottom: 1px solid #191d2b; }
tbody tr:last-child { border-bottom: none; }
td {
  padding: 6px 12px; text-align: center;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
td:first-child { text-align: left; font-weight: 600; font-size: 11px; }
td:nth-child(2) { color: var(--dim); font-size: 11px; text-align: left; }

.c-danger { background: var(--c-danger); color: var(--t-danger); }
.c-warn   { background: var(--c-warn);   color: var(--t-warn); }
.c-good   { background: var(--c-good);   color: var(--t-good); }
.c-full   { background: var(--c-full);   color: var(--t-full); font-weight: 700; }
.c-na     { color: var(--dim); }

/* 平均行 */
.avg-row td {
  background: var(--surface2) !important;
  color: var(--text) !important;
  font-weight: 800; font-size: 11px;
  border-top: 2px solid var(--border);
}
.avg-val { color: #f87171!important; }

/* 月区切り */
.m-sep td { border-top: 2px solid var(--border); }

/* 曜日色 */
.r-sat td:first-child { color: #60a5fa; }
.r-sun td:first-child { color: #f87171; }

/* ローディング */
#loading {
  display: none; text-align: center;
  padding: 60px; color: var(--dim); font-size: 14px;
}
.spin {
  width: 28px; height: 28px; margin: 0 auto 14px;
  border: 2px solid var(--border); border-top-color: #f87171;
  border-radius: 50%; animation: sp .7s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo">📊</div>
  <div>
    <h1>部屋タイプ別 稼働率</h1>
    <div class="sub" id="header-sub">読み込み中…</div>
  </div>
  <a class="back" href="index.html">← ポータル</a>
</header>

<div id="meta-bar">
  <span class="mb-file" id="mb-file"></span>
  <span class="mb-saved" id="mb-saved"></span>
  <span class="mb-badge">LIVE</span>
</div>

<div id="loading"><div class="spin"></div>データを取得中…</div>

<div id="empty" style="display:none">
  <div class="empty-icon">📭</div>
  <h2>データがまだありません</h2>
  <p>管理者がタイプ台帳をアップロードすると<br>ここに稼働率が表示されます。</p>
</div>

<div id="main" style="display:none">
  <div class="legend">
    <div class="leg"><div class="leg-sw" style="background:var(--c-full)"></div>80%以上</div>
    <div class="leg"><div class="leg-sw" style="background:var(--c-good)"></div>50〜79%</div>
    <div class="leg"><div class="leg-sw" style="background:var(--c-warn)"></div>30〜49%</div>
    <div class="leg"><div class="leg-sw" style="background:var(--c-danger)"></div>30%未満</div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>日付</th><th>曜</th>
        <th>和室</th><th>2Fツイン</th><th>3Fツイン</th><th>4Fツイン</th>
        <th>3階露天</th><th>4階露天</th><th>特別室</th>
        <th>全体</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const STORAGE_KEY = 'occ_data_v1';
const ROOM_TYPES = ['和室','2Fツイン','3Fツイン','4Fツイン','3階露天付','4階露天付','特別室'];
const DOW = ['日','月','火','水','木','金','土'];

function cls(v) {
  if (v === null) return 'c-na';
  if (v >= .80) return 'c-full';
  if (v >= .50) return 'c-good';
  if (v >= .30) return 'c-warn';
  return 'c-danger';
}
function colorStyle(v) {
  if (v === null) return '';
  if (v >= .80) return 'color:var(--t-full)';
  if (v >= .50) return 'color:var(--t-good)';
  if (v >= .30) return 'color:var(--t-warn)';
  return 'color:var(--t-danger)';
}
function pct(v) { return v !== null ? Math.round(v*100)+'%' : '—'; }
function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getMonth()+1}/${String(d.getDate()).padStart(2,'0')}`;
}
function fmtSaved(iso) {
  const d = new Date(iso);
  return `更新: ${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

async function load() {
  document.getElementById('loading').style.display = 'block';
  try {
    const r = await window.storage.get(STORAGE_KEY, true);
    document.getElementById('loading').style.display = 'none';

    if (!r) { showEmpty(); return; }

    const { data, filename, parsedAt } = JSON.parse(r.value);
    if (!data || data.length === 0) { showEmpty(); return; }

    // メタバー
    document.getElementById('mb-file').textContent = filename;
    document.getElementById('mb-saved').textContent = fmtSaved(parsedAt);
    document.getElementById('meta-bar').style.display = 'flex';
    document.getElementById('header-sub').textContent =
      `${new Date(data[0].date).getMonth()+1}月〜 ${data.length}日分`;

    render(data);
  } catch(err) {
    document.getElementById('loading').style.display = 'none';
    showEmpty();
  }
}

function showEmpty() {
  document.getElementById('empty').style.display = 'block';
  document.getElementById('header-sub').textContent = 'データなし';
}

function render(data) {
  document.getElementById('main').style.display = 'block';

  // サマリー
  const allOvr = data.map(d=>d.overall).filter(v=>v!==null);
  const avgAll = allOvr.reduce((s,v)=>s+v,0)/allOvr.length;
  const typeAvgs = ROOM_TYPES.map((_,ti)=>{
    const vals = data.map(d=>d.occs[ti]).filter(v=>v!==null);
    return vals.length ? vals.reduce((s,v)=>s+v,0)/vals.length : null;
  });

  const sg = document.getElementById('summary');
  sg.innerHTML = '';
  const addCard = (label, val, sub) => {
    const el = document.createElement('div');
    el.className = 'sc';
    el.innerHTML = `<div class="sc-label">${label}</div>
      <div class="sc-val" style="${colorStyle(val)}">${pct(val)}</div>
      <div class="sc-sub">${sub}</div>`;
    sg.appendChild(el);
  };
  addCard('全体平均', avgAll, `${data.length}日間`);
  ROOM_TYPES.forEach((rt,i) => addCard(rt, typeAvgs[i], '平均'));

  // テーブル
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  const months = {};
  data.forEach(row => {
    const d = new Date(row.date);
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    if (!months[key]) months[key] = [];
    months[key].push(row);
  });

  let first = true;
  Object.values(months).forEach(mRows => {
    mRows.forEach((row, ri) => {
      const d = new Date(row.date);
      const dow = d.getDay();
      const tr = document.createElement('tr');
      if (!first && ri === 0) tr.className = 'm-sep';
      if (dow === 6) tr.classList.add('r-sat');
      if (dow === 0) tr.classList.add('r-sun');
      tr.innerHTML = `
        <td>${fmtDate(row.date)}</td>
        <td>${DOW[dow]}</td>
        ${row.occs.map(v=>`<td class="${cls(v)}">${pct(v)}</td>`).join('')}
        <td class="${cls(row.overall)}">${pct(row.overall)}</td>`;
      tbody.appendChild(tr);
    });

    // 月平均行
    const label = `${new Date(mRows[0].date).getMonth()+1}月平均`;
    const tAvgs = ROOM_TYPES.map((_,ti)=>{
      const vals = mRows.map(r=>r.occs[ti]).filter(v=>v!==null);
      return vals.length ? vals.reduce((s,v)=>s+v,0)/vals.length : null;
    });
    const oVals = mRows.map(r=>r.overall).filter(v=>v!==null);
    const oAvg = oVals.length ? oVals.reduce((s,v)=>s+v,0)/oVals.length : null;

    const avgTr = document.createElement('tr');
    avgTr.className = 'avg-row';
    avgTr.innerHTML = `
      <td colspan="2">${label}</td>
      ${tAvgs.map(v=>`<td class="avg-val">${pct(v)}</td>`).join('')}
      <td class="avg-val">${pct(oAvg)}</td>`;
    tbody.appendChild(avgTr);
    first = false;
  });
}

load();
</script>
</body>
</html>
