<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HACCP衛生管理記録 — 下呂観光ホテル</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --border: #333;
      --today-bg: #fff8e1;
      --error: #c62828;
      --header-bg: #37474f;
      --header-text: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "MS Gothic", "Yu Gothic", Meiryo, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: #111;
    }
    .app { padding: 12px 16px 24px; max-width: 1600px; margin: 0 auto; }
    h1 { font-size: 16px; margin: 0 0 10px; font-weight: bold; }

    .status-bar {
      padding: 6px 10px;
      margin-bottom: 8px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    .status-bar.show { display: block; }
    .status-bar.saving { background: #fff8e1; border: 1px solid #f9a825; }
    .status-bar.saved  { background: #e8f5e9; border: 1px solid #2e7d32; }
    .status-bar.error  { background: #ffebee; border: 1px solid #c62828; }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px 16px;
      align-items: flex-end; margin-bottom: 12px;
      padding: 10px; background: #fff;
      border: 1px solid #ccc; border-radius: 4px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 11px; color: #444; }
    .facility-input {
      width: 280px; padding: 6px 8px;
      border: 1px solid #888; border-radius: 3px;
    }
    .nav-group, .btn-group { display: flex; gap: 6px; align-items: center; }
    button {
      padding: 7px 12px; border: 1px solid #555; border-radius: 3px;
      background: #eceff1; cursor: pointer; font-size: 13px; font-family: inherit;
    }
    button:hover:not(:disabled) { background: #dde3e6; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .ym-label { font-size: 15px; font-weight: bold; min-width: 120px; text-align: center; }
    .today-confirm-done { color: #2e7d32; font-size: 12px; margin-left: 4px; }

    .tabs { display: flex; gap: 6px; align-items: center; margin: 0 0 10px; }
    .tab-btn {
      padding: 8px 12px; border: 1px solid #555; border-radius: 999px;
      background: #f3f5f6; cursor: pointer; font-size: 13px;
    }
    .tab-btn[aria-selected="true"] { background: #cfd8dc; font-weight: bold; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .table-wrap { overflow-x: auto; background: #fff; border: 1px solid #ccc; }
    table { border-collapse: collapse; width: 100%; table-layout: fixed; }
    th, td { border: 1px solid var(--border); padding: 3px 4px; vertical-align: middle; word-break: break-word; }
    thead th {
      background: var(--header-bg); color: var(--header-text);
      font-weight: bold; font-size: 11px; line-height: 1.25; text-align: center;
    }
    td.day-cell { width: 36px; text-align: center; font-weight: bold; }
    td.mark-cell {
      text-align: center; cursor: pointer; font-size: 15px;
      user-select: none; width: 44px;
    }
    td.mark-cell.mark-disabled { cursor: not-allowed; background: #f0f0f0; color: #bbb; }
    td.mark-cell.mark-pending  { cursor: default; background: #fafafa; }
    td.mark-cell.mark-intentional-empty { background: #e9e9e9; color: #666; }
    td.today-row { background: var(--today-bg); }
    textarea.input-note {
      width: 100%; min-height: 44px; resize: vertical;
      border: 1px solid #888; padding: 4px;
      font-family: inherit; font-size: 12px;
    }
    textarea.input-note.note-error {
      border: 2px solid var(--error);
      outline: 2px solid rgba(198,40,40,0.25);
    }
    .input-locked { background: #f3f3f3 !important; color: #555; cursor: not-allowed; }
    td.staff-cell {
      text-align: center; font-size: 12px; font-weight: bold;
      white-space: nowrap; width: 9%;
    }
    td.staff-cell.staff-pending  { background: #fafafa; }
    td.staff-cell.staff-disabled { background: #f0f0f0; color: #bbb; }
    .print-header { display: none; }
    .print-page-break { display: none; }
    .fixed-note {
      margin: 10px 0 0; padding: 8px 10px;
      border: 1px solid #bbb; background: #fafafa; white-space: pre-line;
    }

    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      body { background: #fff; font-size: 6px; }
      .no-print { display: none !important; }
      .print-header { display: block !important; margin-bottom: 6px; text-align: center; }
      .tab-panel { display: block !important; }
      .print-page-break { display: block !important; break-after: page; page-break-after: always; height: 0; }
      .print-header .ph-title { font-size: 11px; font-weight: bold; margin: 0 0 4px; }
      .print-header .ph-sub   { font-size: 10px; margin: 0; }
      .app { padding: 0; max-width: none; }
      .table-wrap { border: none; }
      table { width: 100%; table-layout: fixed; font-size: 6px; }
      th, td { padding: 1px 2px; border: 1px solid #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      thead th { background: #eee !important; color: #000 !important; }
      td.today-row { background: #fff9e6 !important; }
      td.mark-cell.mark-disabled { background: #f5f5f5 !important; }
      textarea.input-note { border: 1px solid #000 !important; font-size: 6px; min-height: 22px; }
      td.staff-cell { font-size: 6px; font-weight: bold; }
    }
  </style>
</head>
<body>
<div class="app">
  <h1 class="no-print">HACCP衛生管理記録 — 下呂観光ホテル</h1>

  <div id="statusBar" class="status-bar"></div>

  <div class="toolbar no-print">
    <div class="field">
      <label for="facilityName">施設名</label>
      <input type="text" id="facilityName" class="facility-input" value="下呂観光ホテル" readonly />
    </div>
    <div class="nav-group">
      <button type="button" id="btnPrevMonth">前月</button>
      <span class="ym-label" id="ymDisplay"></span>
      <button type="button" id="btnNextMonth">翌月</button>
      <button type="button" id="btnThisMonth">今月</button>
    </div>
    <div class="btn-group">
      <button type="button" id="btnConfirmToday">本日確定</button>
      <span id="confirmStatus" class="today-confirm-done" hidden>本日確定済み</span>
    </div>
    <div class="btn-group">
      <button type="button" id="btnPrint">印刷</button>
    </div>
  </div>

  <div class="tabs no-print" role="tablist" aria-label="記録タブ">
    <button class="tab-btn" type="button" id="tabCritical" role="tab" aria-selected="true" aria-controls="panelCritical">重要管理の実施記録</button>
    <button class="tab-btn" type="button" id="tabGeneral"  role="tab" aria-selected="false" aria-controls="panelGeneral">一般衛生管理の実施記録</button>
  </div>

  <section id="panelCritical" class="tab-panel active" role="tabpanel" aria-labelledby="tabCritical">
    <header class="print-header" aria-hidden="true">
      <p class="ph-title">重要管理の実施記録</p>
      <p class="ph-sub" id="printSubCritical"></p>
    </header>
    <div class="table-wrap">
      <table id="recordTableCritical">
        <colgroup>
          <col style="width:6%" /><col style="width:7%" /><col style="width:7%" />
          <col style="width:7%" /><col style="width:7%" /><col style="width:7%" />
          <col style="width:7%" /><col style="width:42%" /><col style="width:10%" />
        </colgroup>
        <thead>
          <tr>
            <th rowspan="2">月日</th>
            <th colspan="6">重要管理項目</th>
            <th rowspan="2">特記事項</th>
            <th rowspan="2">記録者</th>
          </tr>
          <tr>
            <th>非加熱のもの<br />（冷たいまま提供）</th>
            <th>加熱後速やかに提供</th>
            <th>加熱後保温して提供</th>
            <th>加熱調理品を冷却して提供</th>
            <th>加熱調理品を冷却後保管し、再加熱して提供</th>
            <th>盛付・配膳</th>
          </tr>
        </thead>
        <tbody id="recordBodyCritical"></tbody>
      </table>
    </div>
  </section>

  <div class="print-page-break"></div>

  <section id="panelGeneral" class="tab-panel" role="tabpanel" aria-labelledby="tabGeneral">
    <header class="print-header" aria-hidden="true">
      <p class="ph-title">一般衛生管理の実施記録</p>
      <p class="ph-sub" id="printSubGeneral"></p>
    </header>
    <div class="table-wrap">
      <table id="recordTableGeneral">
        <colgroup>
          <col style="width:6%" /><col style="width:6%" /><col style="width:6%" />
          <col style="width:6%" /><col style="width:6%" /><col style="width:6%" />
          <col style="width:6%" /><col style="width:6%" /><col style="width:42%" />
          <col style="width:10%" />
        </colgroup>
        <thead>
          <tr>
            <th>月日</th>
            <th>従業員の健康確認</th>
            <th>手洗いの実施</th>
            <th>冷蔵庫温度<br />（10℃以下）</th>
            <th>冷凍庫温度<br />（-15℃以下）</th>
            <th>食材の検収</th>
            <th>調理器具の洗浄・消毒</th>
            <th>厨房の清掃</th>
            <th>特記事項</th>
            <th>記録者</th>
          </tr>
        </thead>
        <tbody id="recordBodyGeneral"></tbody>
      </table>
    </div>
    <div class="fixed-note">
異常が確認される場合は担当者に速やかに連絡し、
発生した異常を特記事項欄に記録する。
    </div>
  </section>
</div>

<script>
(function () {
  // ======= Supabase設定 =======
  var SUPABASE_URL = 'https://grfadivifbeegsvuseoc.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdyZmFkaXZpZmJlZWdzdnVzZW9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NDM5MTEsImV4cCI6MjA5MzMxOTkxMX0.KtkVb9GkxIYaZqvoi-M7gWerM5TbRhy4ELAR-4GhYXQ';
  var TABLE = 'haccp_records';
  var COL_KEYS_CRITICAL = ['g1','g21','g22','g31','g32','serve'];
  var COL_KEYS_GENERAL  = ['health','handwash','fridge','freezer','inspect','tools','kitchen'];

  // ======= ステータス表示 =======
  var statusBar = document.getElementById('statusBar');
  function showStatus(msg, type) {
    statusBar.textContent = msg;
    statusBar.className = 'status-bar show ' + type;
    if (type === 'saved') setTimeout(function(){ statusBar.className = 'status-bar'; }, 2000);
  }

  // ======= Supabase API =======
  function sbFetch(path, method, body) {
    return fetch(SUPABASE_URL + '/rest/v1/' + path, {
      method: method || 'GET',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': method === 'POST' ? 'resolution=merge-duplicates,return=minimal' : 'return=minimal'
      },
      body: body ? JSON.stringify(body) : undefined
    });
  }

  // ======= データキャッシュ =======
  // cache[record_type][dateKey][col_key] = value
  // cache[record_type][dateKey].__note = ''
  // cache[record_type][dateKey].__confirmed = false
  var cache = { critical: {}, general: {} };
  var loadedYM = {}; // { 'critical_2026_05': true }

  function cacheKey(type, y, m) { return type + '_' + y + '_' + pad2(m); }

  async function loadMonth(type, y, m) {
    var ck = cacheKey(type, y, m);
    if (loadedYM[ck]) return;
    var q = TABLE + '?record_type=eq.' + type + '&year=eq.' + y + '&month=eq.' + m + '&select=*';
    try {
      var res = await sbFetch(q);
      if (!res.ok) throw new Error(await res.text());
      var rows = await res.json();
      if (!cache[type]) cache[type] = {};
      rows.forEach(function(row) {
        var dk = dateKey(y, m, row.day);
        if (!cache[type][dk]) cache[type][dk] = {};
        if (row.col_key === '__note') {
          cache[type][dk].__note = row.value;
        } else if (row.col_key === '__confirmed') {
          cache[type][dk].__confirmed = row.value === 'true';
        } else if (row.col_key === '__staff') {
          cache[type][dk].__staff = row.value;
        } else {
          cache[type][dk][row.col_key] = row.value;
        }
      });
      loadedYM[ck] = true;
    } catch(e) {
      showStatus('データ読み込みエラー: ' + e.message, 'error');
    }
  }

  async function saveCell(type, y, m, d, colKey, value) {
    showStatus('保存中...', 'saving');
    var body = { record_type: type, year: y, month: m, day: d, col_key: colKey, value: String(value), note: '', confirmed: false };
    try {
      var res = await sbFetch(TABLE, 'POST', body);
      if (!res.ok) throw new Error(await res.text());
      showStatus('保存しました', 'saved');
    } catch(e) {
      showStatus('保存エラー: ' + e.message, 'error');
    }
  }

  async function saveNote(type, y, m, d, note) {
    await saveCell(type, y, m, d, '__note', note);
  }

  async function saveConfirmed(type, y, m, d, confirmed) {
    await saveCell(type, y, m, d, '__confirmed', confirmed ? 'true' : 'false');
  }

  // ======= 日付ユーティリティ =======
  function pad2(n) { return String(n).padStart(2, '0'); }
  function dateKey(y, m, d) { return y + '-' + pad2(m) + '-' + pad2(d); }
  function daysInMonth(y, mi) { return new Date(y, mi + 1, 0).getDate(); }
  function startOfLocalDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function compareDay(ay,am,ad,by,bm,bd) {
    if (ay!==by) return ay-by; if (am!==bm) return am-bm; return ad-bd;
  }

  // ======= 状態 =======
  var today = startOfLocalDay(new Date());
  var state = {
    year: today.getFullYear(),
    monthIndex: today.getMonth(),
    activeTab: 'critical',
    today: today
  };

  var els = {
    ymDisplay:      document.getElementById('ymDisplay'),
    bodyCritical:   document.getElementById('recordBodyCritical'),
    bodyGeneral:    document.getElementById('recordBodyGeneral'),
    btnPrev:        document.getElementById('btnPrevMonth'),
    btnNext:        document.getElementById('btnNextMonth'),
    btnThisMonth:   document.getElementById('btnThisMonth'),
    btnConfirm:     document.getElementById('btnConfirmToday'),
    confirmStatus:  document.getElementById('confirmStatus'),
    btnPrint:       document.getElementById('btnPrint'),
    printSubC:      document.getElementById('printSubCritical'),
    printSubG:      document.getElementById('printSubGeneral'),
    tabCritical:    document.getElementById('tabCritical'),
    tabGeneral:     document.getElementById('tabGeneral'),
    panelCritical:  document.getElementById('panelCritical'),
    panelGeneral:   document.getElementById('panelGeneral'),
  };

  // ======= セル状態取得 =======
  function getStoredCell(type, dk, colKey) {
    var rec = cache[type][dk];
    if (!rec) return undefined;
    var v = rec[colKey];
    return (v === '✕' || v === '') ? v : undefined;
  }

  function getEffectiveCell(type, y, m, d, colKey) {
    var t = state.today;
    var dk = dateKey(y, m, d);
    var rec = cache[type][dk] || {};
    var cmpFuture = compareDay(y,m,d, t.getFullYear(),t.getMonth()+1,t.getDate()) > 0;
    var isToday   = y===t.getFullYear() && m===t.getMonth()+1 && d===t.getDate();
    if (cmpFuture) return '';
    if (isToday && !rec.__confirmed) return '';
    var stored = getStoredCell(type, dk, colKey);
    if (stored === '✕') return '✕';
    if (stored === '') return '';
    return '✓';
  }

  function isInteractable(type, y, m, d) {
    var t = state.today;
    var cmpFuture = compareDay(y,m,d, t.getFullYear(),t.getMonth()+1,t.getDate()) > 0;
    if (cmpFuture) return false;
    var isToday = y===t.getFullYear() && m===t.getMonth()+1 && d===t.getDate();
    if (isToday) {
      var dk = dateKey(y,m,d);
      return !!(cache[type][dk] && cache[type][dk].__confirmed);
    }
    return true;
  }

  function rowHasAnyX(type, y, m, d, colKeys) {
    return colKeys.some(function(ck){ return getEffectiveCell(type,y,m,d,ck) === '✕'; });
  }

  // ======= セルクリック =======
  async function onMarkClick(type, y, m, d, colKey, td, ta, colKeys) {
    if (!isInteractable(type, y, m, d)) return;
    var dk = dateKey(y,m,d);
    if (!cache[type][dk]) cache[type][dk] = {};
    var cur = getEffectiveCell(type, y, m, d, colKey);
    var newVal;
    if (cur === '✓') newVal = '✕';
    else if (cur === '✕') newVal = '';
    else { delete cache[type][dk][colKey]; refreshMarkCell(type,td,y,m,d,colKey,ta,colKeys); updateNoteError(type,dk,ta,colKeys); return; }
    cache[type][dk][colKey] = newVal;
    refreshMarkCell(type,td,y,m,d,colKey,ta,colKeys);
    updateNoteError(type,dk,ta,colKeys);
    await saveCell(type, y, m, d, colKey, newVal);
  }

  function refreshMarkCell(type, td, y, m, d, colKey, ta, colKeys) {
    var disp = getEffectiveCell(type, y, m, d, colKey);
    td.textContent = disp;
    var t = state.today;
    var dk = dateKey(y,m,d);
    var future = compareDay(y,m,d, t.getFullYear(),t.getMonth()+1,t.getDate()) > 0;
    var isToday = y===t.getFullYear() && m===t.getMonth()+1 && d===t.getDate();
    var rec = cache[type][dk] || {};
    var pendingToday = isToday && !rec.__confirmed;
    var intentionalEmpty = !future && !pendingToday && getStoredCell(type,dk,colKey) === '';
    td.classList.remove('mark-disabled','mark-pending','mark-intentional-empty');
    if (future) td.classList.add('mark-disabled');
    else if (pendingToday) td.classList.add('mark-pending');
    else if (intentionalEmpty) td.classList.add('mark-intentional-empty');
  }

  function updateNoteError(type, dk, ta, colKeys) {
    var parts = dk.split('-');
    var y=+parts[0], m=+parts[1], d=+parts[2];
    var need = rowHasAnyX(type, y, m, d, colKeys);
    var empty = !ta.value.trim();
    if (need && empty) ta.classList.add('note-error');
    else ta.classList.remove('note-error');
  }

  // ======= テーブル構築 =======
  async function buildTable(type, bodyEl, colKeys) {
    bodyEl.innerHTML = '';
    var y = state.year, mo = state.monthIndex;
    await loadMonth(type, y, mo+1);
    var dim = daysInMonth(y, mo);
    var t = state.today;
    var ty = t.getFullYear(), tm = t.getMonth()+1, td_ = t.getDate();

    for (var day = 1; day <= dim; day++) {
      (function(day){
        var dk = dateKey(y, mo+1, day);
        var rec = cache[type][dk] || {};
        var tr = document.createElement('tr');
        var isToday_ = y===ty && mo+1===tm && day===td_;
        if (isToday_) tr.classList.add('today-row');

        // 日付セル
        var tdDay = document.createElement('td');
        tdDay.className = 'day-cell';
        tdDay.textContent = String(day);
        tr.appendChild(tdDay);

        // マークセル
        var markTds = [];
        colKeys.forEach(function(ck) {
          var tdM = document.createElement('td');
          tdM.className = 'mark-cell';
          tdM.setAttribute('data-col', ck);
          tr.appendChild(tdM);
          markTds.push(tdM);
        });

        // 特記事項
        var tdNote = document.createElement('td');
        var ta = document.createElement('textarea');
        ta.className = 'input-note';
        ta.rows = 2;
        ta.value = rec.__note || '';
        var noteTimer = null;
        ta.addEventListener('input', function() {
          if (!cache[type][dk]) cache[type][dk] = {};
          cache[type][dk].__note = ta.value;
          updateNoteError(type, dk, ta, colKeys);
          clearTimeout(noteTimer);
          noteTimer = setTimeout(function(){ saveNote(type, y, mo+1, day, ta.value); }, 800);
        });
        var isFuture = compareDay(y,mo+1,day,ty,tm,td_) > 0;
        if (isFuture) { ta.readOnly = true; ta.classList.add('input-locked'); }
        tdNote.appendChild(ta);
        tr.appendChild(tdNote);

        // 記録者セル（自由入力）
        var tdStaff = document.createElement('td');
        tdStaff.className = 'staff-cell';
        var taStaff = document.createElement('textarea');
        taStaff.className = 'input-note';
        taStaff.rows = 2;
        taStaff.style.fontSize = '12px';
        taStaff.value = rec.__staff || '';
        taStaff.placeholder = '記録者名';
        var staffTimer = null;
        taStaff.addEventListener('input', function() {
          if (!cache[type][dk]) cache[type][dk] = {};
          cache[type][dk].__staff = taStaff.value;
          clearTimeout(staffTimer);
          staffTimer = setTimeout(function(){ saveCell(type, y, mo+1, day, '__staff', taStaff.value); }, 800);
        });
        var cmpFuture = compareDay(y,mo+1,day,ty,tm,td_) > 0;
        if (cmpFuture) { taStaff.readOnly = true; taStaff.classList.add('input-locked'); }
        tdStaff.appendChild(taStaff);
        tr.appendChild(tdStaff);

        bodyEl.appendChild(tr);

        // マークセル初期化・イベント
        markTds.forEach(function(tdM) {
          var ck = tdM.getAttribute('data-col');
          refreshMarkCell(type, tdM, y, mo+1, day, ck, ta, colKeys);
          tdM.addEventListener('click', function() {
            onMarkClick(type, y, mo+1, day, ck, tdM, ta, colKeys);
          });
        });
        updateNoteError(type, dk, ta, colKeys);
      })(day);
    }
  }

  // ======= 確定ボタン =======
  function monthContainsToday() {
    return state.today.getFullYear()===state.year && state.today.getMonth()===state.monthIndex;
  }

  function updateConfirmButton() {
    if (!monthContainsToday()) { els.btnConfirm.disabled=true; els.confirmStatus.hidden=true; return; }
    var t = state.today;
    var dk = dateKey(t.getFullYear(), t.getMonth()+1, t.getDate());
    var doneC = !!(cache.critical[dk] && cache.critical[dk].__confirmed);
    var doneG = !!(cache.general[dk]  && cache.general[dk].__confirmed);
    var doneAll = doneC && doneG;
    els.btnConfirm.disabled = doneAll;
    els.confirmStatus.hidden = !doneAll;
  }

  // ======= 年月表示 =======
  function refreshYM() {
    els.ymDisplay.textContent = state.year + '年' + pad2(state.monthIndex+1) + '月';
    var sub = '下呂観光ホテル　' + state.year + '年' + pad2(state.monthIndex+1) + '月分';
    els.printSubC.textContent = sub;
    els.printSubG.textContent = sub;
    var isCurrentMonth = state.year===new Date().getFullYear() && state.monthIndex===new Date().getMonth();
    els.btnThisMonth.disabled = isCurrentMonth;
  }

  async function reload() {
    refreshYM();
    await Promise.all([
      buildTable('critical', els.bodyCritical, COL_KEYS_CRITICAL),
      buildTable('general',  els.bodyGeneral,  COL_KEYS_GENERAL)
    ]);
    updateConfirmButton();
  }

  // ======= 初期化 =======
  function setActiveTab(tab) {
    state.activeTab = tab;
    els.tabCritical.setAttribute('aria-selected', tab==='critical' ? 'true' : 'false');
    els.tabGeneral.setAttribute('aria-selected',  tab==='general'  ? 'true' : 'false');
    els.panelCritical.classList.toggle('active', tab==='critical');
    els.panelGeneral.classList.toggle('active',  tab==='general');
  }

  els.tabCritical.addEventListener('click', function(){ setActiveTab('critical'); });
  els.tabGeneral.addEventListener('click',  function(){ setActiveTab('general'); });

  els.btnPrev.addEventListener('click', async function() {
    if (state.monthIndex===0) { state.year--; state.monthIndex=11; } else { state.monthIndex--; }
    await reload();
  });
  els.btnNext.addEventListener('click', async function() {
    if (state.monthIndex===11) { state.year++; state.monthIndex=0; } else { state.monthIndex++; }
    await reload();
  });
  els.btnThisMonth.addEventListener('click', async function() {
    state.today = startOfLocalDay(new Date());
    state.year = state.today.getFullYear();
    state.monthIndex = state.today.getMonth();
    await reload();
  });

  els.btnConfirm.addEventListener('click', async function() {
    if (!monthContainsToday()) return;
    var t = state.today;
    var y = t.getFullYear(), m = t.getMonth()+1, d = t.getDate();
    var dk = dateKey(y, m, d);
    if (!cache.critical[dk]) cache.critical[dk] = {};
    if (!cache.general[dk])  cache.general[dk]  = {};
    if (cache.critical[dk].__confirmed && cache.general[dk].__confirmed) return;
    cache.critical[dk].__confirmed = true;
    cache.general[dk].__confirmed  = true;
    await Promise.all([
      saveConfirmed('critical', y, m, d, true),
      saveConfirmed('general',  y, m, d, true)
    ]);
    await reload();
  });

  els.btnPrint.addEventListener('click', function() { refreshYM(); window.print(); });

  reload();
})();
</script>
</body>
</html>
