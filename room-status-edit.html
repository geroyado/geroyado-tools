<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客室状況 — フロント編集用</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #f5f5f5; font-family: 'Hiragino Kaku Gothic Pro', Meiryo, sans-serif; }
.app { width: 100%; padding: 6px 10px; }
.header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.title { font-size: 20px; font-weight: 700; color: #222; }
.edit-badge { font-size: 10px; background: #E8F4FF; color: #0060AA; border: 1px solid #90C8F0; border-radius: 4px; padding: 2px 6px; }
.mode-btns { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.mode-btn {
  padding: 7px 0; font-size: 12px; font-weight: 600;
  border-radius: 6px; cursor: pointer; white-space: nowrap;
  border: 1.5px solid #ccc; background: #f0f0f0; color: #999;
  user-select: none; width: 130px; text-align: center; padding: 7px 0;
}
.btn-reset { border-color: #999; background: #fff; color: #555; width: auto; padding: 7px 14px; }
.btn-unoccupied { border-color: #888; background: #EEEEEE; color: #444; width: auto; padding: 7px 14px; }
.divider { width: 1px; height: 20px; background: #ddd; margin: 0 2px; }
.mode-banner-wrap { height: 24px; margin-bottom: 6px; border-radius: 6px; overflow: hidden; position: relative; }
.mode-banner {
  position: absolute; inset: 0; display: flex; align-items: center;
  padding: 0 10px; font-size: 11px; font-weight: 500;
  opacity: 0; transition: opacity 0.15s; pointer-events: none;
}
.mode-banner.visible { opacity: 1; }
.banner-prep { background: #F2ECFF; color: #6030AA; }
.banner-in   { background: #E8F4FF; color: #0060AA; }
.banner-out  { background: #FFF3E6; color: #B85C00; }
.legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
.legend-item { display: flex; align-items: center; gap: 3px; font-size: 13px; color: #444; }
.legend-dot { width: 14px; height: 14px; border-radius: 2px; flex-shrink: 0; }
.floor { margin-bottom: 6px; }
.floor-label { font-size: 13px; font-weight: 600; color: #666; margin-bottom: 4px; }
.rooms { display: flex; gap: 7px; width: 100%; padding: 0 10px; }
.room-wrapper { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 0; }
.room-wrapper.blank { flex: 1; }
.room-sep { width: 14px; flex-shrink: 0; }
/* シャトルバスボックス */
.shuttle-box { flex: 1; min-width: 0; max-width: none; width: 0; border-radius: 6px; border: 2px solid #999; background: #F8F8F8; padding: 4px 6px; display: flex; flex-direction: column; gap: 3px; font-size: 11px; }
.shuttle-title {
  font-size: 11px; font-weight: 700; color: #444;
  text-align: center; margin-bottom: 1px;
}
.shuttle-status {
  text-align: center; cursor: pointer; user-select: none;
  font-size: 12px; font-weight: 700;
  padding: 2px 0; border-radius: 4px;
}
.shuttle-status.running { background: #00C040; color: #fff; }
.shuttle-status.closed  { background: #AAA;    color: #fff; }
.shuttle-row {
  display: flex; align-items: center; gap: 4px;
  padding: 2px 0;
}
.shuttle-row.dimmed { opacity: 0.4; }
.shuttle-time { font-size: 11px; font-weight: 600; color: #444; width: 36px; flex-shrink: 0; }
.shuttle-btn {
  flex: 1; text-align: center; cursor: pointer; user-select: none;
  font-size: 10px; font-weight: 600;
  padding: 2px 0; border-radius: 3px; border: 1px solid #ccc;
}
.shuttle-btn.has  { background: #FFD600; border-color: #C8A800; color: #5A4000; }
.shuttle-btn.none { background: #eee;    border-color: #ccc;    color: #888; }
.shuttle-btn.confirmed   { background: #00C040; border-color: #008A2C; color: #fff; }
.shuttle-btn.unconfirmed { background: #eee;    border-color: #ccc;    color: #888; }
.room {
  width: 100%; aspect-ratio: 1.3 / 1;
  border-radius: 5px 5px 0 0; border: 2px solid transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; user-select: none; transition: filter 0.1s;
}
.room:hover { filter: brightness(1.1); }
.room-number { font-size: clamp(12px, 2vw, 18px); font-weight: 500; }
.room-number.cabin-label { font-size: clamp(11px, 1.5vw, 14px); }
.sub-bar {
  width: 100%; height: clamp(20px, 2.8vh, 28px);
  border-radius: 0 0 4px 4px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; user-select: none;
  font-size: clamp(11px, 1.3vw, 13px); font-weight: 500;
  border: 1.5px solid transparent; border-top: none;
}
.sub-empty     { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.08); color: transparent; }
.sub-noshi     { background: #FFF0B0; border-color: #DDB800; color: #7A5800; }
.sub-breakfast { background: #FFF0B0; border-color: #DDB800; color: #7A5800; }
.sub-check     { background: #FFE0C0; border-color: #E07820; color: #804000; }
.sub-clean     { background: #E0F0FF; border-color: #60A8E0; color: #004080; }
.sub-noaccess  { background: #FF3B3B; border-color: #CC0000; color: #fff; }
.s-unused     { background: #AAA; border-color: #888; }
.s-unused .room-number { color: #fff; }
.s-unoccupied { background: #555; border-color: #333; }
.s-unoccupied .room-number { color: #fff; }
.s-staying    { background: #FF3B3B; border-color: #CC0000; }
.s-staying .room-number { color: #fff; }
.s-h8         { background: #FFD600; border-color: #C8A800; }
.s-h8 .room-number { color: #5A4000; }
.s-h9         { background: #00C040; border-color: #008A2C; }
.s-h9 .room-number { color: #fff; }
.s-inroom     { background: #fff; border-color: #BBB; }
.s-inroom .room-number { color: #333; }
.s-out        { background: #0090FF; border-color: #0060C0; }
.s-out .room-number { color: #fff; }
.memo-section { margin-top: 6px; }
.memo-title { font-size: 11px; font-weight: 500; color: #888; margin-bottom: 4px; }
.memo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.memo-col { display: flex; flex-direction: column; gap: 3px; }
.memo-cell {
  border: 1px solid #D0D0D0; border-radius: 3px;
  padding: 3px 6px; font-size: 17px; height: 36px;
  background: #FFFEF5; color: #333; outline: none;
  resize: none; overflow-y: auto;
  font-family: 'Hiragino Kaku Gothic Pro', Meiryo, sans-serif; line-height: 1.4;
}
.memo-cell:focus { border-color: #999; background: #FFFFF0; color: #111; }
.sync-status { font-size: 10px; color: #999; margin-left: 8px; }
.sync-status.ok { color: #00A040; }
.sync-status.err { color: #CC3300; }
.confirm-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.35); z-index: 200;
  align-items: center; justify-content: center;
}
.confirm-overlay.open { display: flex; }
.confirm-box { background: #fff; border-radius: 12px; padding: 24px 20px; width: 260px; text-align: center; }
.confirm-msg { font-size: 14px; color: #333; margin-bottom: 18px; line-height: 1.6; }
.confirm-btns { display: flex; gap: 8px; justify-content: center; }
.confirm-btn { padding: 8px 20px; font-size: 13px; font-weight: 500; border-radius: 8px; cursor: pointer; border: 1.5px solid transparent; user-select: none; }
.confirm-ok     { background: #CC3300; color: #fff; border-color: #CC3300; }
.confirm-cancel { background: #f0f0f0; color: #666; border-color: #ccc; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <span class="title">客室状況</span>
    <span class="edit-badge">フロント編集用</span>
    <span class="sync-status" id="syncStatus">接続中...</span>
    <div class="mode-btns">
      <div class="mode-btn btn-reset" id="btnReset">リセット</div>
      <div class="mode-btn btn-unoccupied" id="btnUnoccupied">一括未着</div>
      <div class="divider"></div>
      <div class="mode-btn btn-prep"    id="btnPrep">準備モード</div>
      <div class="mode-btn btn-checkin" id="btnIn">チェックインモード</div>
      <div class="mode-btn btn-checkout"id="btnOut">チェックアウトモード</div>
    </div>
  </div>
  <div class="mode-banner-wrap">
    <div class="mode-banner banner-prep" id="bannerPrep">準備モード ON — 未着 → 連泊 → 未利用</div>
    <div class="mode-banner banner-in"   id="bannerIn">チェックインモード ON — 朝食8時 → 朝食9時 → 在室 → 未着（繰り返し）</div>
    <div class="mode-banner banner-out"  id="bannerOut">チェックアウトモード ON — チェックアウト済 → 連泊 → 在室 → 未利用</div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#AAA"></div>未利用</div>
    <div class="legend-item"><div class="legend-dot" style="background:#555"></div>未着</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FFD600"></div>朝食8時</div>
    <div class="legend-item"><div class="legend-dot" style="background:#00C040"></div>朝食9時</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fff;border:1.5px solid #BBB"></div>在室</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FF3B3B"></div>連泊</div>
    <div class="legend-item"><div class="legend-dot" style="background:#0090FF"></div>チェックアウト済</div>
  </div>
  <div id="floors"></div>
  <div class="memo-section">
    <div class="memo-grid">
      <div>
        <div class="memo-title">連絡事項</div>
        <div class="memo-col" id="memoLeft"></div>
      </div>
      <div>
        <div class="memo-title">引き継ぎ事項</div>
        <div class="memo-col" id="memoRight"></div>
      </div>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-msg">全室を未利用にリセットし、<br>メモも消去します。<br>よろしいですか？</div>
    <div class="confirm-btns">
      <div class="confirm-btn confirm-cancel" id="confirmCancel">キャンセル</div>
      <div class="confirm-btn confirm-ok" id="confirmOk">リセット</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, onValue, update } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyBHGHSqKn_enfNstKvlm3tMnanlCrMQJmk",
  authDomain: "gero-room-status.firebaseapp.com",
  databaseURL: "https://gero-room-status-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gero-room-status",
  storageBucket: "gero-room-status.firebasestorage.app",
  messagingSenderId: "404284538951",
  appId: "1:404284538951:web:2f56016b2837c21b373162"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const auth = getAuth(app);
signInAnonymously(auth);

const FLOORS = [
  { label: '4階', rooms: [401,402,403,405,406,407,408,410,411,412] },
  { label: '3階', rooms: [301,302,303,305,306,307,308,310,311,312] },
  { label: '2階', rooms: [201,202,203,205,206,207,208,210,'cabin','shuttle'] }
];
const BLANK=['202'], SPECIAL=['gap','cabin','shuttle'];
const NORMAL_CYCLE  =['unused','unoccupied','h8','h9','inroom','staying','out'];
const PREP_CYCLE    =['unoccupied','staying','unused'];
const CHECKIN_CYCLE =['h8','h9','inroom','unoccupied'];
const CHECKOUT_CYCLE=['out','staying','inroom','unused'];
const SUB_CYCLE=['','noshi','breakfast','check','clean','noaccess'];
const SUB_LABELS={'':'',noshi:'素泊まり',breakfast:'1泊朝食',check:'確認',clean:'清掃可能',noaccess:'入室禁止'};

const allRooms=[];
FLOORS.forEach(f=>f.rooms.forEach(r=>{if(!['202','gap','cabin'].includes(String(r)))allRooms.push(String(r));}));
allRooms.push('cabin');

const state={};
allRooms.forEach(r=>{state[r]={status:'unused',sub:''};});
const memoState=Array(14).fill('');
let mode=null;
let memoTimers={};

// シャトルバス状態
const shuttleState={
  running: false,
  times:[
    {label:'9:45',  has:false, confirmed:false},
    {label:'10:10', has:false, confirmed:false}
  ],
  extra: {requested:false, confirmed:false}
};

// Firebase接続状態
const syncEl=document.getElementById('syncStatus');

// Firebase購読
const roomsRef=ref(db,'rooms');
onValue(roomsRef, snap=>{
  const data=snap.val()||{};
  allRooms.forEach(r=>{
    if(data[r]){
      state[r].status=data[r].status||'unused';
      state[r].sub=data[r].sub||'';
    }
    renderRoom(r);
  });
  syncEl.textContent='● 同期中';
  syncEl.className='sync-status ok';
}, err=>{
  syncEl.textContent='● 接続エラー';
  syncEl.className='sync-status err';
});

onValue(ref(db,'shuttle'), snap=>{
  const data=snap.val()||{};
  shuttleState.running = data.running||false;
  if(data.times){
    shuttleState.times.forEach((t,i)=>{
      if(data.times[i]){
        t.has=data.times[i].has||false;
        t.confirmed=data.times[i].confirmed||false;
      }
    });
  }
  if(data.extra){
    shuttleState.extra.requested=data.extra.requested||false;
    shuttleState.extra.confirmed=data.extra.confirmed||false;
  }
  renderShuttle();
});

function writeShuttle(){
  update(ref(db,'shuttle'),{
    running: shuttleState.running,
    times: shuttleState.times.map(t=>({has:t.has,confirmed:t.confirmed})),
    extra: {requested:shuttleState.extra.requested, confirmed:shuttleState.extra.confirmed}
  });
}
function renderShuttle(){
  const box=document.getElementById('shuttle-box');
  if(!box)return;
  const st=document.getElementById('shuttle-status');
  st.textContent=shuttleState.running?'運行':'運休';
  st.className='shuttle-status '+(shuttleState.running?'running':'closed');
  shuttleState.times.forEach((t,i)=>{
    const row=document.getElementById('shuttle-row-'+i);
    const hasBtn=document.getElementById('shuttle-has-'+i);
    const confBtn=document.getElementById('shuttle-conf-'+i);
    row.className='shuttle-row'+(shuttleState.running?'':' dimmed');
    hasBtn.textContent=t.has?'あり':'なし';
    hasBtn.className='shuttle-btn '+(t.has?'has':'none');
    confBtn.textContent=t.confirmed?'確認':'未確認';
    confBtn.className='shuttle-btn '+(t.confirmed?'confirmed':'unconfirmed');
  });
  const extraReqBtn=document.getElementById('shuttle-extra-req');
  const extraConfBtn=document.getElementById('shuttle-extra-conf');
  const extraRow=document.getElementById('shuttle-row-extra');
  if(extraRow) extraRow.className='shuttle-row'+(shuttleState.running?'':' dimmed');
  if(extraReqBtn){
    extraReqBtn.textContent=shuttleState.extra.requested?'依頼':'なし';
    extraReqBtn.className='shuttle-btn '+(shuttleState.extra.requested?'has':'none');
  }
  if(extraConfBtn){
    extraConfBtn.textContent=shuttleState.extra.confirmed?'確認':'未確認';
    extraConfBtn.className='shuttle-btn '+(shuttleState.extra.confirmed?'confirmed':'unconfirmed');
  }
}
function makeShuttleBox(){
  const wrapper=document.createElement('div');wrapper.className='room-wrapper';
  const box=document.createElement('div');box.className='shuttle-box';box.id='shuttle-box';
  box.style.cssText='width:100%;border-radius:5px;border:2px solid #999;background:#F8F8F8;padding:3px 4px;display:flex;flex-direction:column;justify-content:space-around;font-size:11px;overflow:hidden;';
  // 部屋(aspect-ratio 1.3/1) + サブバー(clamp(20px,2.8vh,28px)) の合計高さをJSで設定
  wrapper.style.cssText='flex:1;min-width:0;display:flex;flex-direction:column;';
  box.style.flex='1';
  const title=document.createElement('div');title.className='shuttle-title';title.textContent='シャトルバス';
  const status=document.createElement('div');status.className='shuttle-status closed';status.id='shuttle-status';status.textContent='運休';
  status.addEventListener('click',()=>{
    shuttleState.running=!shuttleState.running;
    renderShuttle(); writeShuttle();
  });
  box.appendChild(title);box.appendChild(status);
  shuttleState.times.forEach((t,i)=>{
    const row=document.createElement('div');row.className='shuttle-row';row.id='shuttle-row-'+i;
    const timeEl=document.createElement('div');timeEl.className='shuttle-time';timeEl.textContent=t.label;
    const hasBtn=document.createElement('div');hasBtn.className='shuttle-btn none';hasBtn.id='shuttle-has-'+i;hasBtn.textContent='なし';
    hasBtn.addEventListener('click',()=>{
      shuttleState.times[i].has=!shuttleState.times[i].has;
      renderShuttle(); writeShuttle();
    });
    const confBtn=document.createElement('div');confBtn.className='shuttle-btn unconfirmed';confBtn.id='shuttle-conf-'+i;confBtn.textContent='未確認';
    confBtn.addEventListener('click',()=>{
      shuttleState.times[i].confirmed=!shuttleState.times[i].confirmed;
      renderShuttle(); writeShuttle();
    });
    row.appendChild(timeEl);row.appendChild(hasBtn);row.appendChild(confBtn);
    box.appendChild(row);
  });
  const extraRow=document.createElement('div');extraRow.className='shuttle-row'+(shuttleState.running?'':' dimmed');extraRow.id='shuttle-row-extra';
  const extraLabel=document.createElement('div');extraLabel.className='shuttle-time';extraLabel.textContent='臨時';
  const extraReqBtn=document.createElement('div');extraReqBtn.className='shuttle-btn none';extraReqBtn.id='shuttle-extra-req';extraReqBtn.textContent='なし';
  extraReqBtn.addEventListener('click',()=>{
    shuttleState.extra.requested=!shuttleState.extra.requested;
    renderShuttle(); writeShuttle();
  });
  const extraConfBtn=document.createElement('div');extraConfBtn.className='shuttle-btn unconfirmed';extraConfBtn.id='shuttle-extra-conf';extraConfBtn.textContent='未確認';
  extraConfBtn.addEventListener('click',()=>{
    shuttleState.extra.confirmed=!shuttleState.extra.confirmed;
    renderShuttle(); writeShuttle();
  });
  extraRow.appendChild(extraLabel);extraRow.appendChild(extraReqBtn);extraRow.appendChild(extraConfBtn);
  box.appendChild(extraRow);
  wrapper.appendChild(box);
  return wrapper;
}

const memoRef=ref(db,'memo_left');
onValue(memoRef, snap=>{
  const data=snap.val()||{};
  for(let i=0;i<7;i++){
    const ta=document.getElementById('memo-left-'+i);
    if(ta && document.activeElement!==ta) ta.value=data['left_'+i]||'';
  }
});
onValue(ref(db,'memo_right'), snap=>{
  const data=snap.val()||{};
  for(let i=0;i<7;i++){
    const ta=document.getElementById('memo-right-'+i);
    if(ta && document.activeElement!==ta) ta.value=data['right_'+i]||'';
  }
});

function writeRoom(r){
  update(ref(db,'rooms/'+r),{status:state[r].status,sub:state[r].sub});
}
function writeMemoLeft(i,val){ update(ref(db,'memo_left'),{['left_'+i]:val}); }
function writeMemoRight(i,val){ update(ref(db,'memo_right'),{['right_'+i]:val}); }
function resetShuttle(){
  shuttleState.running=false;
  shuttleState.times.forEach(t=>{t.has=false;t.confirmed=false;});
  shuttleState.extra.requested=false;
  shuttleState.extra.confirmed=false;
  writeShuttle();
  renderShuttle();
}
function doUnoccupied(){
  const updates={};
  allRooms.forEach(r=>{state[r].status='unoccupied';updates['rooms/'+r]={status:'unoccupied',sub:state[r].sub};renderRoom(r);});
  update(ref(db),updates);
  resetShuttle();
}

function setBtn(el,bg,color,border){el.style.background=bg;el.style.color=color;el.style.borderColor=border;}
function toggleMode(m){
  mode=(mode===m)?null:m;
  setBtn(document.getElementById('btnPrep'),mode==='prep'?'#7B4FCC':'#f0f0f0',mode==='prep'?'#fff':'#999',mode==='prep'?'#7B4FCC':'#ccc');
  setBtn(document.getElementById('btnIn'),  mode==='in'  ?'#0070CC':'#f0f0f0',mode==='in'  ?'#fff':'#999',mode==='in'  ?'#0070CC':'#ccc');
  setBtn(document.getElementById('btnOut'), mode==='out' ?'#B85C00':'#f0f0f0',mode==='out' ?'#fff':'#999',mode==='out' ?'#B85C00':'#ccc');
  document.getElementById('bannerPrep').classList.toggle('visible',mode==='prep');
  document.getElementById('bannerIn').classList.toggle('visible',mode==='in');
  document.getElementById('bannerOut').classList.toggle('visible',mode==='out');
}
function doReset(){
  const updates={};
  allRooms.forEach(r=>{state[r]={status:'unused',sub:''};updates['rooms/'+r]={status:'unused',sub:''};renderRoom(r);});
  const emptyLeft={};
  for(let i=0;i<7;i++){emptyLeft['left_'+i]='';}
  updates['memo_left']=emptyLeft;
  update(ref(db),updates);
  for(let i=0;i<7;i++){const ta=document.getElementById('memo-left-'+i);if(ta)ta.value='';}
  resetShuttle();
  document.getElementById('confirmOverlay').classList.remove('open');
}
function clickRoom(r){
  const s=state[r];
  if(mode==='out'){
    const idx=CHECKOUT_CYCLE.indexOf(s.status);
    if(idx===-1){s.status='out';s.sub='';}
    else{s.status=CHECKOUT_CYCLE[(idx+1)%CHECKOUT_CYCLE.length];if(s.status!=='inroom')s.sub='';}
  }else if(mode==='prep'){
    const idx=PREP_CYCLE.indexOf(s.status);s.status=PREP_CYCLE[(idx+1)%PREP_CYCLE.length];
  }else if(mode==='in'){
    const idx=CHECKIN_CYCLE.indexOf(s.status);s.status=idx===-1?CHECKIN_CYCLE[0]:CHECKIN_CYCLE[(idx+1)%CHECKIN_CYCLE.length];
  }else{
    const idx=NORMAL_CYCLE.indexOf(s.status);s.status=NORMAL_CYCLE[(idx+1)%NORMAL_CYCLE.length];
  }
  renderRoom(r); writeRoom(r);
}
function clickSub(r){
  const s=state[r];s.sub=SUB_CYCLE[(SUB_CYCLE.indexOf(s.sub)+1)%SUB_CYCLE.length];
  renderRoom(r); writeRoom(r);
}
function renderRoom(r){
  const roomEl=document.getElementById('room-'+r),subEl=document.getElementById('sub-'+r);
  if(!roomEl)return;
  const s=state[r];
  roomEl.className='room s-'+s.status;
  subEl.className='sub-bar '+(s.sub?'sub-'+s.sub:'sub-empty');
  subEl.textContent=SUB_LABELS[s.sub]||'';
}
function makeRoom(r,label,small){
  const wrapper=document.createElement('div');wrapper.className='room-wrapper';
  const roomEl=document.createElement('div');roomEl.className='room s-'+(state[r]?state[r].status:'unused');roomEl.id='room-'+r;
  const span=document.createElement('span');span.className='room-number'+(small?' cabin-label':'');span.textContent=label;
  roomEl.appendChild(span);roomEl.addEventListener('click',()=>clickRoom(r));
  const subEl=document.createElement('div');subEl.className='sub-bar sub-empty';subEl.id='sub-'+r;
  subEl.addEventListener('click',()=>clickSub(r));
  wrapper.appendChild(roomEl);wrapper.appendChild(subEl);
  return wrapper;
}
function renderAll(){
  const container=document.getElementById('floors');container.innerHTML='';
  FLOORS.forEach(f=>{
    const floorDiv=document.createElement('div');floorDiv.className='floor';
    floorDiv.innerHTML=`<div class="floor-label">${f.label}</div>`;
    const rowEl=document.createElement('div');rowEl.className='rooms';
    f.rooms.forEach(r=>{
      if(r==='gap'){const g=document.createElement('div');g.className='room-wrapper blank';rowEl.appendChild(g);}
      else if(r==='cabin'){rowEl.appendChild(makeRoom('cabin','キャビン',true));}
      else if(r==='shuttle'){rowEl.appendChild(makeShuttleBox());}
      else if(String(r)==='202'){const b=document.createElement('div');b.className='room-wrapper blank';rowEl.appendChild(b);}
      else{
        rowEl.appendChild(makeRoom(String(r),String(r),false));
        if(String(r).endsWith('5')){const sep=document.createElement('div');sep.className='room-sep';rowEl.appendChild(sep);}
      }
    });
    floorDiv.appendChild(rowEl);container.appendChild(floorDiv);
  });
  document.getElementById('btnReset').addEventListener('click',()=>document.getElementById('confirmOverlay').classList.add('open'));
  document.getElementById('btnUnoccupied').addEventListener('click',doUnoccupied);
  document.getElementById('btnPrep').addEventListener('click',()=>toggleMode('prep'));
  document.getElementById('btnIn').addEventListener('click',()=>toggleMode('in'));
  document.getElementById('btnOut').addEventListener('click',()=>toggleMode('out'));
  document.getElementById('confirmOk').addEventListener('click',doReset);
  document.getElementById('confirmCancel').addEventListener('click',()=>document.getElementById('confirmOverlay').classList.remove('open'));
  // 部屋+サブバーの高さをシャトルバスに同期
  function syncShuttleHeight(){
    const anyRoom=document.querySelector('.room-wrapper:not(.blank) .room');
    const anySub=document.querySelector('.room-wrapper:not(.blank) .sub-bar');
    const shuttleBox=document.getElementById('shuttle-box');
    if(anyRoom && anySub && shuttleBox){
      const h=anyRoom.offsetHeight + anySub.offsetHeight;
      shuttleBox.style.height=h+'px';
    }
  }
  syncShuttleHeight();
  window.addEventListener('resize', syncShuttleHeight);
}
function buildMemo(){
  const left=document.getElementById('memoLeft');
  const right=document.getElementById('memoRight');
  function makeCell(id, writeFn, withDate){
    const ta=document.createElement('textarea');ta.className='memo-cell';ta.rows=1;ta.id=id;
    ta.addEventListener('keydown',(e)=>{ if(e.key==='Enter') e.preventDefault(); });
    ta.addEventListener('blur',()=>{
      if(ta.value.length>0 && !ta.value.startsWith('[')){
        const now=new Date();
        const hh=String(now.getHours()).padStart(2,'0');
        const mm=String(now.getMinutes()).padStart(2,'0');
        let stamp;
        if(withDate){
          const mo=String(now.getMonth()+1).padStart(2,'0');
          const dd=String(now.getDate()).padStart(2,'0');
          stamp='['+mo+'/'+dd+' '+hh+':'+mm+'] ';
        }else{
          stamp='['+hh+':'+mm+'] ';
        }
        ta.value=stamp+ta.value;
        clearTimeout(memoTimers[id]);
        memoTimers[id]=setTimeout(()=>writeFn(ta.value),100);
      }
    });
    ta.addEventListener('input',()=>{
      clearTimeout(memoTimers[id]);
      memoTimers[id]=setTimeout(()=>writeFn(ta.value),500);
    });
    return ta;
  }
  for(let i=0;i<7;i++){
    left.appendChild(makeCell('memo-left-'+i, val=>writeMemoLeft(i,val), false));
  }
  for(let i=0;i<7;i++){
    right.appendChild(makeCell('memo-right-'+i, val=>writeMemoRight(i,val), true));
  }
}
renderAll();buildMemo();

// 10:30になったらシャトルバスを自動リセット
let shuttleAutoResetDone = false;
function checkShuttleAutoReset(){
  const now = new Date();
  const hh = now.getHours();
  const mm = now.getMinutes();
  const todayKey = now.toDateString();
  // 10:30以降かつ本日まだリセットしていない場合
  if(hh > 10 || (hh === 10 && mm >= 30)){
    const lastReset = localStorage.getItem('shuttleAutoResetDate');
    if(lastReset !== todayKey){
      resetShuttle();
      localStorage.setItem('shuttleAutoResetDate', todayKey);
    }
  } else {
    // 10:30前になったらフラグをリセット（翌日対応）
    localStorage.removeItem('shuttleAutoResetDate');
  }
}
checkShuttleAutoReset();
setInterval(checkShuttleAutoReset, 60000); // 1分ごとにチェック
</script>
